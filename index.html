/* ---------- 종목 관리 ---------- */
/* 모든 종목(루틴·내가 만든 종목·기록에만 남은 종목)을 한곳에서: 이름·고정 안내·증량 단위·바벨·좌우, 동작 영상, 합치기, 삭제.
   세트·횟수·휴식은 루틴마다 다르게 둘 수 있어서 여기서는 바꾸지 않음. 영상은 종목(id)에 붙음(애니멀플로우는 루틴 A/B 따로) */
let xmQ='',xmOpen=null,xmDel=null,xmClipDel=null,vidAsk=null;
function clipKeysOf(id){return [id,id+':A',id+':B'].filter(k=>clipURL[k])}
function libMap(){const m=new Map();for(const g of library())for(const e of g.items)if(!m.has(e.id))m.set(e.id,e);return m}
/* 루틴에서 빼거나 루틴을 지운 뒤: 어디에도 없게 된 종목 중 영상이 남은 것을 물어볼 목록에 올림 */
function askOrphans(before){const after=libMap(),L=[];for(const [id,d] of before)if(!after.has(id)&&clipKeysOf(id).length)L.push({id,d:clone(d)});vidAsk=L.length?L:null}
function exWhere(id){const w=rkeys().filter(k=>RT()[k].ex.some(e=>e.id===id)).map(k=>RT()[k].name);if((db.custom||[]).some(e=>e.id===id))w.push('내가 만든 종목');return w}
function exList(){const ids=[...libMap().keys()];for(const w of Object.values(db.workouts))for(const it of w.items)if(!ids.includes(it.ex.id))ids.push(it.ex.id);
 const L=ids.map(id=>({id,d:exDef(id),n:recCount(id),where:exWhere(id),clip:clipKeysOf(id).length>0})).filter(x=>x.d);
 /* 이 기능 전에 지운 종목에 남은 영상도 보여서 지울 수 있게 함 */
 for(const k of Object.keys(clipURL)){const id=k.replace(/:[AB]$/,'');if(!L.some(x=>x.id===id))L.push({id,d:exDef(id),n:0,where:[],clip:true,orphan:true})}
 return L.sort((a,b)=>(!!a.orphan-!!b.orphan)||(a.d?a.d.name:'').localeCompare(b.d?b.d.name:'','ko'))}
function xmVisible(){const q=nkey(xmQ);return exList().filter(x=>!q||nkey(x.d?x.d.name:'').includes(q))}
function renderEx(){$('p-ex').innerHTML=`<h3>종목 관리</h3><p>모든 종목의 이름·고정 안내·동작 영상을 여기서 바꿔요. 세트·횟수·휴식은 루틴마다 달라서 루틴 편집이나 운동 화면에서 바꿔요.</p>
 <input class="q" id="xm-q" type="search" placeholder="종목 이름 검색" value="${esc(xmQ)}" aria-label="종목 검색"><div class="edlist" id="xm-list">${xmRows(xmVisible())}</div>`}
function xmRows(L){if(!L.length)return '<p class="note">찾는 종목이 없어요.</p>';
 return L.map(x=>{const op=xmOpen===x.id,nm=x.d?x.d.name:'지운 종목의 영상',sub=x.d&&!x.orphan?`${TYPES[x.d.type]} · ${x.where.length?x.where.join(', '):'기록에만 있음'} · 기록 ${x.n}회${x.clip?' · 영상 있음':''}`:'어느 목록에도 없는 종목의 영상';
  return `<div class="xmitem${op?' open':''}"><div class="edrow"><div><b>${esc(nm)}</b><small>${esc(sub)}</small></div><div class="acts"><button data-xm="open" data-id="${x.id}" aria-expanded="${op}" aria-label="${esc(nm)} ${op?'접기':'관리'}">${op?'▴':'✎'}</button></div></div>${op?xmBox(x):''}</div>`}).join('')}
function xmBox(x){const d=x.orphan?null:x.d,id=x.id;let h='<div class="xmbox">';
 if(d){const t=d.type,f=(k,lab,val,type)=>`<label class="${type==='text'?'w2':''}">${lab}<input id="xm-${k}" type="${type}"${type==='number'?' inputmode="decimal" step="any"':''} value="${esc(val??'')}"></label>`;
  h+=`<div class="form">${f('name','종목 이름',d.name,'text')}${f('note','고정 안내 (선택 · 매번 보여요)',d.note||'','text')}`
   +(t==='weight'?f('inc','증량 단위(kg)',d.inc??2.5,'number')+`<label class="cb"><input type="checkbox" id="xm-bar"${d.bar?' checked':''}>바벨 (원판 표시)</label>`:t==='emom'?f('inc','무게 단위(kg)',d.inc??4,'number'):'')
   +(['weight','reps','hold'].includes(t)?`<label class="cb"><input type="checkbox" id="xm-sides"${d.sides?' checked':''}>좌우 따로 기록</label>`:'')
   +`<div class="row w2" style="grid-column:span 2"><button class="ghost sm ok" data-xm="save" data-id="${id}">저장</button></div></div><p>이름을 바꾸면 모든 루틴과 지난 기록에서 함께 바뀌어요.</p>`}
 const keys=d?(d.type==='flow'?[id+':A',id+':B']:[id]):clipKeysOf(id);
 h+=keys.map(k=>{const lb=k.endsWith(':A')?'루틴 A 영상':k.endsWith(':B')?'루틴 B 영상':'동작 영상',u=clipURL[k],img=u&&(clipType[k]||'').startsWith('image');
  return `<div class="xmclip"><span>${lb}</span>${u?(img?`<img src="${u}" alt="">`:`<video src="${u}" muted loop autoplay playsinline aria-label="${lb}"></video>`)
   +(d?`<button class="ghost sm" data-xm="clip" data-ck="${k}">바꾸기</button>`:'')+`<button class="ghost sm${xmClipDel===k?' danger':''}" data-xm="clipdel" data-ck="${k}">${xmClipDel===k?'정말 영상 삭제':'영상 삭제'}</button>`
   :`<button class="ghost sm" data-xm="clip" data-ck="${k}">+ 영상 넣기</button>`}</div>`}).join('');
 if(d){h+=`<div class="row">${x.where.length?`<button class="ghost sm${xmDel===id?' danger':''}" data-xm="del" data-id="${id}">종목 삭제</button>`:`<button class="ghost sm" data-xm="relist" data-id="${id}">목록에 다시 넣기</button>`}${d.type!=='flow'?`<button class="ghost sm" data-xm="merge" data-id="${id}">다른 종목과 합치기</button>`:''}</div>`;
  if(xmDel===id){const btn=(v,lb,cls)=>`<button class="ghost sm${cls}" data-xm="delgo" data-v="${v}" data-id="${id}">${lb}</button>`;
   h+=`<div class="dupask" role="alert"><b>${esc(jo(d.name,'을','를'))} ${esc(x.where.join(', '))}에서 빼요</b><p>${x.n?`지난 기록 ${x.n}회는 그대로 남고, 종목 관리에는 '기록에만 있음'으로 남아요.`:'기록이 없어서 종목 관리에서도 사라져요.'}</p><div class="row">`
    +(x.clip?(x.n?btn(1,'영상도 같이 삭제',' danger')+btn(0,'종목만 삭제',''):btn(1,'종목과 영상 삭제',' danger')):btn(0,'정말 삭제',' danger'))+`<button class="ghost sm" data-xm="delno">취소</button></div></div>`}}
 return h+'</div>'}
/* 이름·고정 안내·증량·바벨·좌우를 모든 루틴과 '내가 만든 종목'에 적용. 지난 기록은 이름만, 아직 안 끝난 운동은 고정 안내·증량·바벨까지(좌우는 세트 수가 바뀌어 다음 운동부터) */
function saveXm(id){const d=exDef(id);if(!d)return;const g=k=>{const el=$('xm-'+k);return el?el.value:undefined},c=k=>{const el=$('xm-'+k);return el?el.checked:undefined};
 const pn=d.name,name=(g('name')||'').trim()||pn,note=(g('note')||'').trim(),incV=g('inc'),inc=incV===undefined?undefined:(num(incV)>0?num(incV):2.5),bar=c('bar'),sides=c('sides');
 const patch=(e,full)=>{e.name=name;if(note)e.note=note;else delete e.note;if(inc!==undefined)e.inc=inc;if(bar!==undefined){if(bar)e.bar=true;else delete e.bar}if(full&&sides!==undefined){if(sides)e.sides=true;else delete e.sides}};
 if(rkeys().some(k=>RT()[k].ex.some(e=>e.id===id)))ensureEditable();
 for(const k in (db.routines||{}))for(const e of db.routines[k].ex)if(e.id===id)patch(e,true);
 for(const e of (db.custom||[]))if(e.id===id)patch(e,true);
 for(const w of Object.values(db.workouts))for(const it of w.items)if(it.ex.id===id){if(w.status==='done')it.ex.name=name;else patch(it.ex,false)}
 save();xmOpen=null;renderSet();toast(name+' 저장했어요');if(nkey(pn)!==nkey(name)&&sameName(name,id))setTimeout(()=>toast(DUP_TIP),1800)}
async function delExercise(id,withClip){const d=exDef(id),n=recCount(id);if(rkeys().some(k=>RT()[k].ex.some(e=>e.id===id)))ensureEditable();
 for(const k in (db.routines||{}))db.routines[k].ex=db.routines[k].ex.filter(e=>e.id!==id);db.custom=(db.custom||[]).filter(e=>e.id!==id);
 const st=settings();for(const k of ['rest','holdMax'])if(st[k])delete st[k][id];
 if(withClip)for(const k of clipKeysOf(id))await delClip(k);
 xmDel=null;if(!n)xmOpen=null;save();toast((d?d.name:'종목')+' 삭제했어요'+(withClip?' · 영상도 지움':''))}
$('p-ex').addEventListener('input',e=>{if(e.target.id==='xm-q'){xmQ=e.target.value;$('xm-list').innerHTML=xmRows(xmVisible())}});
$('p-ex').addEventListener('click',async e=>{const b=e.target.closest('[data-xm]');if(!b)return;const a=b.dataset.xm,id=b.dataset.id,ck=b.dataset.ck;
 if(a!=='clipdel')xmClipDel=null;if(a!=='del'&&a!=='delgo')xmDel=null;
 if(a==='open'){xmOpen=xmOpen===id?null:id;renderEx();return}
 if(a==='save'){saveXm(id);return}
 if(a==='clip'){clipFor={ck,set:true};const f=$('clipfile');f.value='';f.click();return}
 if(a==='clipdel'){if(xmClipDel!==ck){xmClipDel=ck;renderEx();return}xmClipDel=null;await delClip(ck);toast('영상을 지웠어요');renderSet();return}
 if(a==='del'){xmDel=xmDel===id?null:id;renderEx();return}
 if(a==='delno'){renderEx();return}
 if(a==='delgo'){await delExercise(id,b.dataset.v==='1');renderSet();return}
 if(a==='relist'){const d=exDef(id);if(d&&!inLibrary(id)){(db.custom=db.custom||[]).push(clone(d));save();toast(d.name+' 다시 목록에 넣었어요')}renderSet();return}
 if(a==='merge'){mgFrom=id;mgTo='';mgArm=false;renderMerge();$('p-merge').scrollIntoView({block:'start'})}});

/* ---------- 종목 합치기 ---------- */
/* 같은 운동을 실수로 두 종목으로 만들었을 때: 없앨 종목(from)의 기록을 남길 종목(to)으로 옮기고 from은 루틴·목록에서 뺌.
   기록 방식이 같은 종목끼리만 합치고, 애니멀플로우는 루틴 A/B 영상이 따로라 뺌.
   되돌리기는 합친 직후 다른 것을 바꾸기 전까지만(합치기 전 기록 전체를 메모리에 들고 있음) */
let mgFrom='',mgTo='',mgArm=false,mgBusy=false,mergeUndo=null;
function recCount(id){let n=0;for(const w of Object.values(db.workouts))if(w.items.some(it=>it.ex.id===id&&hasDone(it.en)))n++;return n}
function exSrc(id){for(const k of rkeys())if(RT()[k].ex.some(e=>e.id===id))return RT()[k].name;return (db.custom||[]).some(e=>e.id===id)?'내가 만든 종목':'기록에만 있음'}
function mergeList(){const ids=[];for(const g of library())for(const e of g.items)if(!ids.includes(e.id))ids.push(e.id);
 for(const w of Object.values(db.workouts))for(const it of w.items)if(!ids.includes(it.ex.id))ids.push(it.ex.id);
 return ids.map(id=>{const d=exDef(id);return d&&d.type!=='flow'?{id,d,n:recCount(id),src:exSrc(id)}:null}).filter(Boolean).sort((a,b)=>a.d.name.localeCompare(b.d.name,'ko'))}
function renderMerge(){const L=mergeList(),f=L.find(x=>x.id===mgFrom),tos=f?L.filter(x=>x.id!==f.id&&x.d.type===f.d.type):[];
 if(!f)mgFrom='';if(!tos.some(x=>x.id===mgTo))mgTo='';const t=tos.find(x=>x.id===mgTo);
 const opt=(x,sel)=>`<option value="${x.id}"${x.id===sel?' selected':''}>${esc(x.d.name)} · ${TYPES[x.d.type]} · ${esc(x.src)} · 기록 ${x.n}회</option>`;
 let h=`<h3>종목 합치기</h3><p>같은 운동을 실수로 두 번 만들었을 때(이름이 달라도) 한쪽 기록을 다른 쪽으로 옮겨 하나로 합쳐요. 지난번 기록과 통계가 이어져요.</p>`;
 if(L.length<2)h+='<p class="note">합칠 종목이 아직 없어요.</p>';
 else{h+=`<div class="form" style="background:none;padding:0"><label class="w2">없앨 종목 (기록은 옮겨요)<select id="mg-from"><option value="">고르세요</option>${L.map(x=>opt(x,mgFrom)).join('')}</select></label>
  <label class="w2">남길 종목<select id="mg-to"${f?'':' disabled'}><option value="">${f?(tos.length?'고르세요':'기록 방식이 같은 종목이 없어요'):'먼저 위에서 고르세요'}</option>${tos.map(x=>opt(x,mgTo)).join('')}</select></label></div>`;
  if(f&&t){const fn=f.d.name,tn=t.d.name;h+=`<p class="note">${esc(fn)} 기록 ${f.n}회를 ${esc(jo(tn,'으로','로'))} 옮겨요. 옮긴 기록의 종목 이름도 ${esc(jo(tn,'으로','로'))} 바뀌고, ${esc(jo(fn,'은','는'))} 루틴과 종목 목록에서 빠져요.${clipURL[f.id]?(clipURL[t.id]?' 동작 영상은 '+esc(tn)+' 것만 남아요.':' 동작 영상은 '+esc(jo(tn,'으로','로'))+' 옮겨요.'):''}</p><button class="ghost sm${mgArm?' danger':''}" id="mg-go" style="align-self:flex-start">${mgArm?'정말 합치기':'합치기'}</button>`}}
 if(mergeUndo&&mergeUndo.rev===dataRev)h+=`<div class="row"><button class="ghost sm" id="mg-undo">방금 합친 것 되돌리기</button><span class="note">${esc(mergeUndo.txt)}</span></div>`;
 $('p-merge').innerHTML=h}
async function mergeEx(from,to){const a=exDef(from),b=exDef(to);if(!a||!b||from===to||a.type!==b.type)return false;
 const fn=a.name,tn=b.name,u={raw:JSON.stringify(db),clips:[],txt:fn+' → '+tn},n=recCount(from);ensureEditable();
 for(const w of Object.values(db.workouts))for(const it of w.items)if(it.ex.id===from){it.ex.id=to;it.ex.name=tn}
 /* 루틴에서는 그 루틴의 세트·횟수 설정을 그대로 두고 종목만 바꿈. 이미 남길 종목이 있는 루틴에서는 뺌 */
 for(const k in db.routines){const r=db.routines[k],i=r.ex.findIndex(e=>e.id===from);if(i<0)continue;if(r.ex.some(e=>e.id===to))r.ex.splice(i,1);else{r.ex[i].id=to;r.ex[i].name=tn}}
 db.custom=(db.custom||[]).filter(e=>e.id!==from);if(!inLibrary(to))db.custom.push(clone(Object.assign({},b,{name:tn})));
 const st=settings();for(const k of ['rest','holdMax'])if(st[k])delete st[k][from];if(statEx===from)statEx=to;
 if(clipURL[from]){let blob=null;try{blob=await idbDo('readonly',x=>x.get(from))}catch(e){}
  if(blob){const keep=!!clipURL[to];if(!keep){await putClip(to,blob);if(st.clip&&st.clip[from])st.clip[to]=st.clip[from]}u.clips.push({k:from,blob,del:keep?null:to});await delClip(from)}}
 save();u.rev=dataRev;mergeUndo=u;toast(fn+' 기록 '+n+'회를 '+jo(tn,'으로','로')+' 합쳤어요');return true}
async function undoMerge(){const u=mergeUndo;if(!u||u.rev!==dataRev)return false;mergeUndo=null;const cur=db;
 db=JSON.parse(u.raw);try{migrate()}catch(e){db=cur;return false}if(!save()){db=cur;save();return false}W=W&&db.workouts[W.id]||null;
 for(const c of u.clips){await putClip(c.k,c.blob);if(c.del)await delClip(c.del)}return true}
$('p-merge').addEventListener('change',e=>{const t=e.target;if(t.id==='mg-from'){mgFrom=t.value;mgTo='';mgArm=false;renderMerge()}else if(t.id==='mg-to'){mgTo=t.value;mgArm=false;renderMerge()}});
$('p-merge').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||mgBusy)return;
 if(b.id==='mg-go'){if(!mgArm){mgArm=true;renderMerge();return}mgArm=false;mgBusy=true;try{if(await mergeEx(mgFrom,mgTo)){mgFrom=mgTo=''}}finally{mgBusy=false}renderSet();return}
 if(b.id==='mg-undo'){mgBusy=true;let ok=false;try{ok=await undoMerge()}finally{mgBusy=false}renderSet();toast(ok?'합치기 전으로 되돌렸어요':'되돌리지 못했어요')}});

/* ---------- 백업 ---------- */
function copyText(text,m,after){let settled=false;const ok=()=>{settled=true;m.textContent='복사했어요';after&&after()};
 const fb=()=>{if(settled)return;settled=true;const ta=document.createElement('textarea');ta.value=text;ta.className='code';ta.readOnly=true;m.textContent='아래를 길게 눌러 복사하세요';m.after(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}after&&after()};
 m.textContent='복사하는 중…';setTimeout(fb,1500);try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}}
$('copy').addEventListener('click',()=>{const ta=$('exp'),m=$('copymsg');let settled=false;
 /* 선택해 둔 내용이 풀리지 않게 ta.value는 다시 넣지 않음 */
 const mark=()=>{db.lastBackup=Date.now();save();paintBk()};
 const ok=()=>{settled=true;m.textContent='복사했어요';mark()};const fb=()=>{if(settled)return;settled=true;ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}m.textContent='전체 선택됐어요. 길게 눌러 복사하세요';mark()};
 ta.value=JSON.stringify(Object.assign({},db,{lastBackup:Date.now()}));m.textContent='복사하는 중…';setTimeout(fb,1500);
 try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(e){fb()}});
function paintBk(){$('bkinfo').textContent=(db.lastBackup?'마지막 백업: '+fmtDate(dstr(new Date(db.lastBackup)))+'. ':'아직 백업한 적이 없어요. ')+'아래 내용을 복사해 두거나 파일로 저장하세요.';
 const ks=Object.keys(clipURL),sz=ks.reduce((a,k)=>a+(clipSize[k]||0),0);
 $('clipinfo').textContent=ks.length?`동작 영상 ${ks.length}개(${mb(sz)})는 복사·파일 저장에 들어가지 않아요. '영상까지 저장'은 기록과 영상을 zip 파일 하나로 묶어요. 압축을 풀면 영상 원본도 꺼낼 수 있어요.`:'동작 영상을 넣으면 여기서 기록과 함께 zip 파일 하나로 저장할 수 있어요.';
 $('cliprow').hidden=!ks.length;paintZip();
 const ua=undoAt();$('undorow').hidden=!ua;if(ua){$('undoinfo').textContent=undoArm?'그 뒤에 한 기록은 사라져요. 한 번 더 누르면 되돌려요.':fmtDate(dstr(new Date(ua)))+' '+hm(ua)+'에 불러오기 전 기록';$('undobtn').textContent=undoArm?'정말 되돌리기':'불러오기 전으로 되돌리기';$('undobtn').classList.toggle('danger',undoArm)}}
/* 만든 뒤 기록이나 영상이 바뀌었으면(dataRev) 그 zip은 버리고 다시 만들게 함 */
function paintZip(){if(zipReady&&zipReady.rev!==dataRev){zipReady=null;$('zipmsg').textContent=''}
 $('savezip').textContent=zipReady?'zip 저장 ('+mb(zipReady.blob.size)+')':'영상까지 저장';$('savezip').classList.toggle('ok',!!zipReady)}
function mb(b){return (b/1048576).toFixed(b<10485760?1:0)+'MB'}
function markBackup(){db.lastBackup=Date.now();save();$('exp').value=JSON.stringify(db);paintBk()}
function bkName(ext){return 'platelog-'+today()+'.'+ext}
function bkJSON(){return JSON.stringify(Object.assign({},db,{lastBackup:Date.now(),rest:undefined,timer:undefined}))}
/* 휴대폰은 공유 시트(파일에 저장·AirDrop), 컴퓨터는 다운로드. 공유는 탭 직후에만 열려서 zip은 만든 뒤 한 번 더 누르게 함 */
async function saveFile(blob,name,m){const f=new File([blob],name,{type:blob.type});
 if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({files:[f]});return true}catch(e){if(e&&e.name==='AbortError'){m.textContent='취소했어요';return false}}}
 const a=document.createElement('a'),u=URL.createObjectURL(f);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true}
$('savejson').addEventListener('click',async()=>{const m=$('copymsg');try{if(await saveFile(new Blob([bkJSON()],{type:'application/json'}),bkName('json'),m)){m.textContent='저장했어요';markBackup()}}catch(e){m.textContent='저장하지 못했어요'}});
let zipReady=null;
$('savezip').addEventListener('click',async()=>{const b=$('savezip'),m=$('zipmsg');
 if(zipReady&&zipReady.rev===dataRev){try{if(await saveFile(zipReady.blob,bkName('zip'),m)){zipReady=null;m.textContent='저장했어요';markBackup()}}catch(e){m.textContent='저장하지 못했어요'}return}
 b.disabled=true;m.textContent='zip 만드는 중…';const r0=dataRev;
 try{zipReady={blob:await backupZip(),rev:r0};m.textContent=r0===dataRev?'다 만들었어요. 한 번 더 눌러 저장하세요.':''}catch(e){m.textContent=e&&e.message==='big'?'영상이 너무 커서 zip 하나로 묶을 수 없어요(4GB 이하).':'만들지 못했어요. 휴대폰 저장 공간을 확인해 주세요.'}
 b.disabled=false;paintZip();if(r0!==dataRev)m.textContent='만드는 동안 기록이 바뀌었어요. 다시 눌러 주세요.'});

/* zip (압축 없이 저장만): platelog.json + clips/index.json(영상 키 → 파일) + clips/종목이름.mp4 */
let crcT=null;
function crc32(u8,c=0xFFFFFFFF){if(!crcT){crcT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[n]=c>>>0}}
 for(let i=0;i<u8.length;i++)c=crcT[(c^u8[i])&255]^(c>>>8);return c}
/* 큰 영상을 통째로 메모리에 올리지 않게 조각씩 읽으며 CRC 계산 */
async function blobCrc(b){let c=0xFFFFFFFF;if(b.stream){const r=b.stream().getReader();for(;;){const{done,value}=await r.read();if(done)break;c=crc32(value,c)}}else c=crc32(new Uint8Array(await b.arrayBuffer()),c);return (c^0xFFFFFFFF)>>>0}
async function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[],d=new Date();
 const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();let off=0;
 if(files.length>0xFFFF)throw new Error('big');
 for(const f of files){const nm=enc.encode(f.name),sz=f.blob.size;if(off+30+nm.length+sz>0xFFFFFFFF)throw new Error('big');const crc=await blobCrc(f.blob);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  parts.push(h.buffer,nm,f.blob);cen.push(c.buffer,nm);off+=30+nm.length+sz}
 const cs=cen.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
function clipFileName(k,b,used){const [id,v]=k.split(':'),base=(exName(id)+(v?' '+v:'')).replace(/[\\/:*?"<>|]/g,'').trim()||'clip';
 const ext=({'video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','image/gif':'gif','image/webp':'webp','image/png':'png','image/jpeg':'jpg'})[b.type]||((b.name||'').match(/\.(\w+)$/)||[])[1]||'bin';
 let nm=base,i=2;while(used.has(nm))nm=base+' '+(i++);used.add(nm);return 'clips/'+nm+'.'+ext.toLowerCase()}
async function backupZip(){const keys=((await idbDo('readonly',st=>st.getAllKeys()))||[]).filter(k=>!String(k).startsWith('undo:')),man={},used=new Set(),clips=[];
 for(const k of keys){const b=await idbDo('readonly',st=>st.get(k));if(!b)continue;const nm=clipFileName(k,b,used);man[k]={file:nm,type:b.type||''};clips.push({name:nm,blob:b})}
 return makeZip([{name:'platelog.json',blob:new Blob([bkJSON()],{type:'application/json'})},{name:'clips/index.json',blob:new Blob([JSON.stringify(man)],{type:'application/json'})},...clips])}
/* 다시 묶은 zip(압축됨)도 읽을 수 있게 deflate는 DecompressionStream으로 풂 */
async function readZip(file){const dv=async(a,b)=>new DataView(await file.slice(a,b).arrayBuffer());
 const tail=await dv(Math.max(0,file.size-65557),file.size);let e=-1;for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw 0;
 const cnt=tail.getUint16(e+10,true),co=tail.getUint32(e+16,true),cd=await dv(co,co+tail.getUint32(e+12,true)),dec=new TextDecoder(),ent={};
 for(let p=0,i=0;i<cnt;i++){if(cd.getUint32(p,true)!==0x02014b50)throw 0;const nl=cd.getUint16(p+28,true);
  ent[dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nl))]={m:cd.getUint16(p+10,true),sz:cd.getUint32(p+20,true),lo:cd.getUint32(p+42,true)};p+=46+nl+cd.getUint16(p+30,true)+cd.getUint16(p+32,true)}
 return{names:Object.keys(ent),get:async name=>{const z=ent[name];if(!z)return null;const h=await dv(z.lo,z.lo+30),st=z.lo+30+h.getUint16(26,true)+h.getUint16(28,true),raw=file.slice(st,st+z.sz);
  if(z.m===0)return raw;if(z.m===8&&window.DecompressionStream)return new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();throw 0}}}
async function readBackupZip(f){const z=await readZip(f),jn=z.names.find(n=>/(^|\/)platelog\.json$/.test(n)&&!n.startsWith('__MACOSX'));if(!jn)throw 0;
 const dir=jn.slice(0,-'platelog.json'.length),mn=z.names.includes(dir+'clips/index.json')?dir+'clips/index.json':null,man=mn?JSON.parse(await (await z.get(mn)).text()):{},clips=[];
 for(const k in man){const b=await z.get(dir+man[k].file);if(b)clips.push({k,b:new Blob([b],{type:man[k].type||''})})}
 return{text:await (await z.get(jn)).text(),clips}}

/* zipImp: zip에서 읽은 내용. 붙여 넣은 칸을 고치지 않았으면 '불러오기'를 다시 눌러도 영상까지 함께 씀 */

 const sig=new Uint8Array(await f.slice(0,4).arrayBuffer());
 if(sig[0]===0x50&&sig[1]===0x4B&&sig[2]===3&&sig[3]===4){const m=$('impmsg');pending=null;$('impok').hidden=true;m.textContent='zip 파일 읽는 중…';
  try{const r=await readBackupZip(f);$('imp').value=r.text;zipImp=r;checkImp(r.clips)}catch(err){m.textContent='zip 파일을 읽을 수 없어요. \'영상까지 저장\'으로 만든 파일인지 확인하세요.'}return}

  const n=d.workouts?Object.keys(d.workouts).length:Object.keys(d.sessions).length;
  m.textContent=n+(d.workouts?'개 운동 기록':'일치 기록')+(pendingClips?'과 동작 영상 '+pendingClips.length+'개를':'을')+' 찾았어요. 덮어쓰려면 확인을 누르세요.';$('impok').hidden=false}

/* 바꾸기 전에 모든 화면을 한 번 그려 봐서 깨지는 내용이면 지금 기록을 그대로 둠 */
$('impok').addEventListener('click',async()=>{if(!pending)return;const cl=pendingClips,m=$('impmsg'),old=db,oldW=W;
 edIdx=null;draft=null;
 try{db=pending;W=null;migrate();renderHome();renderRecord();renderStats();renderSet()}catch(e){db=old;W=oldW;renderSet();m.textContent='이 내용은 형식이 맞지 않아 불러오지 않았어요. 지금 기록은 그대로예요.';return}
 /* 되돌리기용으로 불러오기 전 기록을 남겨 둠. 둘 다 담을 자리가 없으면 사본 없이 불러옴 */
