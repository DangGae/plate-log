<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>플레이트 로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="플레이트 로그">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 손 조작용 세로 로그북 — 위 날짜·탭, 가운데 카드, 아래 고정 휴식 바와 키패드. 요일 색은 원판 색(25kg 빨강·20kg 파랑·10kg 초록·15kg 노랑) */
:root{
  --bg:#EEF0EC;--surface:#FFFFFF;--sunk:#E4E7E2;--ink:#15181B;--muted:#5A6168;--line:#D5D9D3;
  --red:#C3302A;--blue:#1E5CB8;--green:#2A8452;--yellow:#B98A00;--plate5:#3A3F44;--onacc:#FFFFFF;--warn-bg:#FFF4D6;--warn:#7A5600;
  --accent:var(--red);
  --f-disp:"Barlow Condensed","Arial Narrow","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315;--surface:#1A1D20;--sunk:#23272B;--ink:#ECEDEA;--muted:#9BA1A7;--line:#2D3237;
  --red:#E5574E;--blue:#5D91E8;--green:#4DB47D;--yellow:#E3B53A;--plate5:#C9CDD1;--onacc:#111315;--warn-bg:#3A2F12;--warn:#F2D27A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315;--surface:#1A1D20;--sunk:#23272B;--ink:#ECEDEA;--muted:#9BA1A7;--line:#2D3237;
  --red:#E5574E;--blue:#5D91E8;--green:#4DB47D;--yellow:#E3B53A;--plate5:#C9CDD1;--onacc:#111315;--warn-bg:#3A2F12;--warn:#F2D27A;color-scheme:dark}
body[data-plate="red"]{--accent:var(--red)}body[data-plate="blue"]{--accent:var(--blue)}
body[data-plate="green"]{--accent:var(--green)}body[data-plate="yellow"]{--accent:var(--yellow)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
body.kp-open{padding-bottom:420px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1}
.brand b{color:var(--accent)}
#date{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.days i{width:10px;height:10px;border-radius:50%;display:block}
.days button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days button.today span{font-weight:600}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px;border-left:6px solid var(--accent);padding-left:10px}
.dayhead h2{font-family:var(--f-disp);font-weight:700;font-size:30px;margin:0;line-height:1.05;white-space:nowrap}
.dayhead p{margin:0;color:var(--muted);font-size:13px}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.banner span{flex:1}
.banner button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ex.done{border-color:var(--accent)}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex h3{margin:0;font-size:17px;font-weight:600}
.ex.done h3::after{content:" ✓";color:var(--accent)}
.tgt{font-family:var(--f-disp);font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.last{font-size:13px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:500}
.sug{align-self:flex-start;border:0;background:var(--accent);color:var(--onacc);font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px}
.sets{display:flex;flex-direction:column;gap:6px}
.setadj{display:flex;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr auto 1fr 46px;align-items:center;gap:6px}
.set.hold{grid-template-columns:34px 1fr 64px 46px}
.set.reps{grid-template-columns:34px 1fr 46px}
.set.emw{grid-template-columns:auto minmax(0,140px) 1fr}.set.emw .n{font-family:inherit;font-size:14px;font-weight:600;padding-right:4px}.set.emw .note{margin:0}
.set .n{font-family:var(--f-disp);font-weight:600;font-size:17px;color:var(--muted);text-align:center}
.set .x{color:var(--muted)}
.cell{position:relative;width:100%;min-width:0;height:40px;font-size:17px;font-variant-numeric:tabular-nums;text-align:center;background:var(--sunk);border:1.5px solid transparent;border-radius:8px;padding:0 22px 0 4px}
.cell .ph{color:var(--muted);opacity:.7}
.cell .u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.cell.editing{border-color:var(--accent);background:var(--surface)}
.cell.fresh .v{background:var(--accent);color:var(--onacc);padding:0 3px;border-radius:3px}
.ck{height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:18px;color:var(--muted)}
.set.ok .ck{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.set.ok .cell{background:none;border-color:var(--line)}
.play{height:40px;border-radius:10px;border:0;background:var(--ink);color:var(--surface);font-weight:600;font-size:14px}
.plates{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.pl{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:5px;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;color:var(--onacc);background:var(--plate5)}
.pl[data-p="25"]{background:var(--red)}.pl[data-p="20"]{background:var(--blue)}.pl[data-p="15"]{background:var(--yellow);color:#1d1600}.pl[data-p="10"]{background:var(--green)}
.pl.sm{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{flex:1;min-width:140px;height:46px;border-radius:12px;border:0;background:var(--ink);color:var(--surface);font-weight:600}
/* 세로로 쌓이는 화면 안에 바로 놓인 큰 버튼(운동 끝의 '기록 저장')은 flex:1 때문에 높이가 글자 높이로 줄어들어서 막음 */
.view>.big{flex:none}
.ghost{height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:none;font-weight:500}
.ghost.ok{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.ghost.sm{height:36px;padding:0 12px;border-radius:9px;font-size:14px}
.ghost.danger{border-color:var(--red);color:var(--red)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:8px;padding:2px}
/* 칩·작은 버튼은 손가락으로 누르기 쉽게 32~34px 이상 */
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
.flow{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.restchip{align-self:flex-start;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;min-height:32px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.restchip.custom{border-color:var(--accent);color:var(--ink)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clipchip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;min-height:32px;font-size:13px;color:var(--muted)}
.clipchip.on{color:var(--ink);border-color:var(--ink)}
.clip{display:flex;flex-direction:column;gap:6px}
.clipbox{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:10px;background:#0E0F10}
.clipbox video,.clipbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateY(var(--y)) scale(var(--z));transform-origin:center}
.cliptools{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.cliptools button{min-width:34px;height:32px;border:1px solid var(--line);background:none;border-radius:8px;font-size:13px;padding:0 8px}
.cliptools .sp{flex:1}
.cliptools .del.arm{background:var(--red);border-color:var(--red);color:#fff}
.restedit{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--sunk);border-radius:10px;padding:6px 8px;font-size:13px}
.restedit span{color:var(--muted)}
.restedit b{font-family:var(--f-disp);font-size:20px;font-weight:700;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.restedit button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:34px;font-size:13px}
.restedit.fedit{display:grid;grid-template-columns:auto 40px 34px 40px 1fr;row-gap:6px;column-gap:6px}
.restedit.fedit b{min-width:0}
.restedit.fedit .fl{grid-column:1/-1;font-weight:600;color:var(--ink)}
.restedit.fedit .okb{grid-column:5;grid-row:2/4;align-self:stretch;margin-left:0;justify-self:end;padding:0 16px}
.restedit .okb{margin-left:auto;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.today-btn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.lastwarn{font-size:13px;margin:0;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:4px 8px;align-self:flex-start}
.summ .kv b{font-size:22px}
.summ .prs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.summ .prs li::before{content:"▲ ";color:var(--green)}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){#toast{animation:tin .25s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}}
/* 휴식 끝·라운드 시작 알림: 화면 전체를 루틴 색으로 세 번 깜빡임 (움직임 줄이기 설정이면 한 번만 옅게) */
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:var(--accent);opacity:0}
#flash.on{animation:flash3 1.5s ease-out}
@keyframes flash3{0%,34%,68%{opacity:.5}17%,51%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:flash1 1.2s ease-out}@keyframes flash1{0%{opacity:.3}100%{opacity:0}}}
.memo .q{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.memo .q small{color:var(--muted);font-size:12px}
.scale{display:inline-grid;grid-template-columns:repeat(5,36px);gap:4px}
.scale button{height:34px;border-radius:8px;border:1px solid var(--line);background:none;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
textarea{width:100%;min-height:64px;font-size:14px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:100px}
.rest-day{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-size:16px}
.panel p{margin:0;font-size:13px;color:var(--muted)}
.msg{font-size:13px;color:var(--accent);min-height:1.2em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:7px;background:var(--sunk);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0;position:relative}
.cal button.did{background:var(--c);color:#fff;font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button.fut{opacity:.35}
.cal button i{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.hcard .d{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.hcard .d span{font-weight:400;color:var(--muted);font-size:13px}
.hcard ul{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hcard .mm{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.d100{display:flex;align-items:baseline;gap:10px}
.d100 b{font-family:var(--f-disp);font-size:52px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.d100 span{color:var(--muted);font-size:14px}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-family:var(--f-disp);font-size:24px;font-variant-numeric:tabular-nums}
.chg{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.chg li{display:flex;justify-content:space-between;gap:8px}
.chg em{font-style:normal;color:var(--green);font-weight:600}
.chg em.dn{color:var(--red)}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.picker button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.picker button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .s1{stroke:var(--ink);stroke-width:2;fill:none}
.chart .s2{stroke:var(--red);stroke-width:2;fill:none;stroke-dasharray:5 4}
.chart .p1{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .p2{fill:var(--red);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:8px;padding:6px 8px;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:500}
.edlist{display:flex;flex-direction:column;gap:6px}
.edrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.edrow b{font-weight:600;font-size:14px}
.edrow small{display:block;color:var(--muted);font-size:12px}
.edrow .acts{display:flex;gap:4px}
.edrow .acts button{width:34px;height:34px;border:1px solid var(--line);background:none;border-radius:8px;font-size:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--sunk);border-radius:12px;padding:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form label.w2{grid-column:span 2}
.form input,.form select{width:100%;min-width:0;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.form .cb{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.form .cb input{width:auto}
/* 요일마다 '월 [근력 ▾]' 한 줄. 7칸 한 줄로 두면 휴대폰에서 루틴 이름이 한두 글자만 보임 */
.dmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.dmap label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dmap select{flex:1;width:auto;min-width:0;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);touch-action:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* 위로 밀거나 시간을 누르면 크게 보기 */
#rest .grab{position:absolute;top:4px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:currentColor;opacity:.35}
#rest .open{flex:1;display:flex;flex-direction:column;min-width:0;border:0;padding:0;border-radius:0;opacity:1;text-align:left}

.dupask{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--surface)}

.dupask p{margin:0;font-size:13px;color:var(--muted)}
.addmemo{align-self:flex-start;border:0;background:none;padding:4px 0;min-height:30px;font-size:13px;color:var(--muted)}
.tbl tr.hasm td{border-bottom:0}
.tbl .mrow td{padding-top:0;font-size:12px;color:var(--muted);white-space:normal;overflow-wrap:anywhere}
.memoview{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

.form .full{grid-column:1/-1}
</style>

<body>
<div class="wrap">
  <div class="top" id="topbar">
    <div class="brand">PLATE<b>LOG</b></div>
    <span class="note" id="topdate"></span>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button id="tab-home" role="tab" data-tab="home" aria-selected="true">홈</button>
    <button id="tab-record" role="tab" data-tab="record" aria-selected="false">기록</button>
    <button id="tab-stats" role="tab" data-tab="stats" aria-selected="false">통계</button>
    <button id="tab-set" role="tab" data-tab="set" aria-selected="false">설정</button>
  </div>

    <div class="panel" id="calpanel"></div>
    <div id="daypanel" class="view"></div>
  </section>
  <section id="v-detail" class="view" hidden></section>

  </section>

    <div class="panel" id="p-merge"></div>
    <div class="panel" id="p-plates"></div>
    <div class="panel" id="p-backup">
      <h3>기록 내보내기</h3>
      <p id="bkinfo">아래 내용을 복사해 두거나 파일로 저장하세요.</p>
      <textarea class="code" id="exp" readonly aria-label="내보낼 기록"></textarea>
      <div class="row"><button class="ghost sm" id="copy">복사</button><button class="ghost sm" id="savejson">파일로 저장</button><span class="msg" id="copymsg"></span></div>
      <p id="clipinfo">동작 영상을 넣으면 여기서 기록과 함께 zip 파일 하나로 저장할 수 있어요.</p>
      <div class="row" id="cliprow" hidden><button class="ghost sm" id="savezip">영상까지 저장</button><span class="msg" id="zipmsg"></span></div>
      <h3>기록 불러오기</h3>
      <p>복사해 둔 내용을 붙여 넣거나 저장한 파일(.json, 영상 포함 .zip)을 고르세요. 지금 기록은 불러온 내용으로 바뀌어요.</p>

      <div class="row"><label class="ghost sm filepick">파일 고르기<input type="file" id="impfile" accept=".json,.txt,.zip,application/json,text/plain,application/zip" aria-label="백업 파일 고르기"></label><button class="ghost sm" id="impbtn">붙여 넣은 내용 읽기</button><button class="ghost sm ok" id="impok" hidden>덮어쓰기 확인</button></div>
      <span class="msg" id="impmsg"></span>
      <div class="row" id="undorow" hidden><button class="ghost sm" id="undobtn">불러오기 전으로 되돌리기</button><span class="note" id="undoinfo"></span></div>

<div class="dockbar" id="homebar" hidden>

<div id="kp" hidden role="dialog" aria-label="숫자 입력">
  <div class="in">
    <div class="kp-head">
      <div><b id="kp-ex"></b><small id="kp-lbl"></small></div>
      <div class="seg" role="group" aria-label="적용 범위"><button id="kp-one" class="on" aria-pressed="true">이 세트만</button><button id="kp-all" aria-pressed="false">전체 세트</button></div>

      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="prev" aria-label="이전 칸">‹</button><button class="op" data-k="next" aria-label="다음 칸">›</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="s-" id="kp-sm">−1</button><button class="op" data-k="s+" id="kp-sp">+1</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="b-" id="kp-bm">−5</button><button class="op" data-k="b+" id="kp-bp">+5</button>
      <button data-k="." id="kp-dot">.</button><button data-k="0">0</button><button class="op" data-k="bs" aria-label="지우기">⌫</button><button class="okk" data-k="ok" aria-label="입력 완료">✓</button>

    <div class="row"><button class="ghost" id="v3-prev">‹ 이전</button><button class="ghost ok" id="v3-play">Ⅱ 멈춤</button><button class="ghost" id="v3-next">다음 ›</button></div>

      <circle id="rb-arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>

      <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>

<script>
const K='platelog.v1';
const DAYS=['일','월','화','수','목','금','토'];
const ORDER=[1,2,3,4,5,6,0];
const COLORS=['red','blue','green','yellow'];
const ALL_PLATES=[25,20,15,10,5,2.5,2,1.25,1,0.5];
const PAINS=['어깨','팔꿈치','손목','허리','고관절','무릎','발목'];
const TYPES={weight:'무게×횟수',reps:'횟수',hold:'버티기(초)',emom:'EMOM',flow:'애니멀플로우',cardio:'시간(분)'};
const FLOW={
 A:['손목 풀기 1분 (준비)','비스트 ↔ 다운독 2회: 엉덩이를 높이 밀어 올렸다 비스트로','발을 손 쪽으로 모아 깊게 쪼그려 앉기, 손은 바닥에서 뗌','사이드 킥스루: 한 다리를 몸 아래로 통과시켜 반대편으로 쭉','비스트로 돌아와 반대쪽 쪼그려 앉기 → 킥스루','킥스루 → 크랩 리치: 엉덩이를 들고 반대 팔을 머리 위로','반대쪽 킥스루 → 크랩 리치 후 비스트 (여기까지 1회)'],
 B:['손목 풀기 1분 (준비)','하프 킥스루: 무릎을 굽힌 채 다리를 몸 아래로 넣었다 빼기, 좌우','사이드 킥스루: 다리를 쭉 펴서 통과, 좌우','트래블링 비스트: 앞으로 2~3걸음','쪼그려 앉아 사이드 런지: 한 다리를 옆으로 뻗고 체중 이동, 좌우','비스트로 돌아와 사이드 킥스루 좌우 후 비스트 (여기까지 1회)']
};
const FLOW3D={A:[null,'비스트 홀드',null,'사이드 킥스루',null,'크랩 리치',null],B:[null,null,'사이드 킥스루','트래블링 비스트','트래블링 에이프','사이드 킥스루']};
const FLOW3D_SEQ={A:['비스트 홀드','사이드 킥스루','크랩 리치'],B:['비스트 홀드','사이드 킥스루','트래블링 비스트','트래블링 에이프']};
const DEF_R={
 S:{name:'근력',sub:'바벨 · 2개 여유 남기기',color:'red',ex:[
  {id:'pullup',name:'중량풀업',type:'weight',n:3,lo:5,hi:8,inc:2.5,rest:150},
  {id:'fsquat',name:'프론트스쿼트',type:'weight',n:3,lo:5,hi:8,inc:5,rest:180,bar:true},
  {id:'mpress',name:'밀리터리프레스',type:'weight',n:3,lo:6,hi:8,inc:2.5,rest:150,bar:true},
  {id:'incline',name:'인클라인벤치프레스',type:'weight',n:3,lo:8,hi:10,inc:2.5,rest:120,bar:true,note:'시간 부족하면 이 종목부터 생략'},
  {id:'dl',name:'데드리프트',type:'weight',n:3,lo:8,hi:8,inc:5,rest:150,bar:true,note:'1RM 60~70% · 3개 이상 여유 · 자세 무너지면 즉시 종료'},
  {id:'hollow',name:'할로우바디 홀드',type:'hold',n:3,target:30,rest:45}]},
 P:{name:'파워·보조',sub:'케틀벨 · 품질 우선',color:'blue',ex:[
  {id:'aflow',name:'애니멀플로우',type:'flow',aN:5,aR:5,bN:4,bR:4,rest:60,note:'손목 풀기 1분은 준비로 먼저 · 동작 순서를 끝까지 하면 1회'},
  {id:'swing',name:'케틀벨 스윙',type:'emom',rounds:10,reps:15},
  {id:'bss',name:'불가리안 스플릿스쿼트',type:'weight',n:3,lo:8,hi:10,inc:2,rest:90,note:'좌우 각각'},
  {id:'thruster',name:'케틀벨 쓰러스트',type:'weight',n:3,lo:8,hi:10,inc:2,rest:90},
  {id:'kbrow',name:'케틀벨 원암로우',type:'weight',n:3,lo:10,hi:12,inc:2,rest:60,note:'좌우 각각'},
  {id:'hlr',name:'행잉레그레이즈',type:'reps',n:3,lo:10,hi:15,rest:60,note:'마지막 세트만 최대 횟수'}]},
 C:{name:'코어·회복',sub:'버티기 30초 · 10~15회',color:'green',ex:[
  {id:'birddog',name:'버드독',type:'reps',n:3,lo:10,hi:15,rest:30,note:'좌우 번갈아'},
  {id:'plank',name:'플랭크',type:'hold',n:3,target:30,rest:30},
  {id:'splank',name:'사이드플랭크',type:'hold',n:3,target:30,rest:20,sides:true},
  {id:'rplank',name:'리버스플랭크',type:'hold',n:3,target:30,rest:30},
  {id:'ols',name:'원레그스탠드',type:'hold',n:3,target:30,rest:15,sides:true},
  {id:'mclimb',name:'마운틴클라이머',type:'reps',n:3,lo:10,hi:15,rest:30},
  {id:'stairs',name:'천국의계단',type:'cardio',min:10,note:'대화 가능한 강도'}]}
};
const DEF_MAP={0:'X',1:'S',2:'P',3:'C',4:'S',5:'P',6:'X'};

/* ---------- 기본 도구 ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'u'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
function mmss(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function num(v){const n=+v;return isFinite(n)?n:0}
function fmtN(n){return String(+(+n).toFixed(2))}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dstr(new Date())}
function pdate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)}
function daysBetween(a,b){return Math.round((pdate(b)-pdate(a))/864e5)}
function dow(s){return pdate(s).getDay()}
function fmtDate(s,short){const d=pdate(s);return short?(d.getMonth()+1)+'.'+d.getDate():(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAYS[d.getDay()]+')'}
function hm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function period(h){return h<5?'새벽':h<11?'아침':h<14?'점심':h<18?'오후':h<22?'저녁':'밤'}
function ago(date){const n=daysBetween(date,today());return n<=0?'오늘':n===1?'어제':n+'일 전'}

/* ---------- 데이터 ---------- */
let db=load(),saveErr=false,dataRev=0;
/* 저장된 내용이 깨져 있으면 빈 데이터로 덮어쓰기 전에 원본을 다른 키에 남겨 둠 */
function load(){let raw=null,d=null;try{raw=localStorage.getItem(K);d=JSON.parse(raw)}catch(e){try{if(raw)localStorage.setItem(K+'.corrupt.'+Date.now(),raw)}catch(e2){}}if(!d||typeof d!=='object')d={};return d}
function save(){dataRev++;try{localStorage.setItem(K,JSON.stringify(db));saveErr=false;return true}catch(e){if(!saveErr){saveErr=true;setTimeout(()=>toast('기록을 저장하지 못했어요. 저장 공간이나 Safari 설정을 확인하고 바로 백업해 두세요'),0)}return false}}
function RT(){return db.routines||DEF_R}
function rkeys(){return Object.keys(RT()).filter(k=>k!=='X')}
function rcolor(k){const r=RT()[k];return (r&&r.color)||({S:'red',P:'blue',C:'green'}[k])||'yellow'}
function DMAP(){return db.dayMap||DEF_MAP}
function settings(){db.settings=db.settings||{};return db.settings}
function barW(){const v=+(db.settings&&db.settings.bar);return v>0?v:20}
function platesAvail(){return (db.settings&&db.settings.plates)||[25,20,15,10,5,2.5,1.25]}
function holdMax(ex){return !!(db.settings&&db.settings.holdMax&&db.settings.holdMax[ex.id])}
function restOf(ex){const v=db.settings&&db.settings.rest&&db.settings.rest[ex.id];return v?+v:ex.rest}
function ensureEditable(){if(!db.routines)db.routines=clone(DEF_R);if(!db.dayMap)db.dayMap=clone(DEF_MAP)}
function findDef(id){for(const k of rkeys())for(const e of RT()[k].ex)if(e.id===id)return e;for(const e of (db.custom||[]))if(e.id===id)return e;for(const k in DEF_R)for(const e of DEF_R[k].ex)if(e.id===id)return e;return null}
function library(){const seen=new Set(),g=[];
 for(const k of rkeys()){const r=RT()[k],items=r.ex.filter(e=>!seen.has(e.id));items.forEach(e=>seen.add(e.id));if(items.length)g.push({name:r.name,c:rcolor(k),items})}
 const cu=(db.custom||[]).filter(e=>!seen.has(e.id));if(cu.length)g.push({name:'내가 만든 종목',c:'yellow',items:cu});return g}
/* 같은 종목인지 이름으로 볼 때는 띄어쓰기·대소문자를 무시함 */
function nkey(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
/* 받침에 맞춰 조사 붙이기: jo('벤치','은','는') → '벤치는'. '으로'는 ㄹ받침 뒤에서도 '로' */
function jo(w,a,b){w=String(w);const c=w.charCodeAt(w.length-1)-0xAC00,t=c%28;return w+(c>=0&&c<=11171&&t&&!(a==='으로'&&t===8)?a:b)}
/* 종목 정의: 루틴·내가 만든 종목 → 없으면 가장 최근 기록에 남은 것 → 그래도 없으면 기본 루틴 것
   (기본 종목 이름을 바꾸고 루틴에서 뺀 뒤에도 바꾼 이름이 보이게 기록을 기본 루틴보다 먼저 봄) */
function exDef(id){for(const k of rkeys())for(const e of RT()[k].ex)if(e.id===id)return e;for(const e of (db.custom||[]))if(e.id===id)return e;let best=null;
 for(const w of Object.values(db.workouts))for(const it of w.items)if(it.ex.id===id&&(!best||wsort(w)>best.k))best={k:wsort(w),ex:it.ex};return best?best.ex:findDef(id)}
function inLibrary(id){return library().some(g=>g.items.some(e=>e.id===id))}
/* 이름이 같은 다른 종목(목록 먼저, 없으면 기록에서). 새로 만들 때 기존 종목을 쓰라고 묻는 데 씀 */
function sameName(name,exceptId){const k=nkey(name);if(!k)return null;
 for(const g of library())for(const e of g.items)if(e.id!==exceptId&&nkey(e.name)===k)return e;
 for(const w of Object.values(db.workouts))for(const it of w.items)if(it.ex.id!==exceptId&&nkey(it.ex.name)===k)return exDef(it.ex.id);return null}
const DUP_TIP='같은 이름의 종목이 따로 있어요 · 같은 운동이면 설정 → 종목 합치기에서 합칠 수 있어요';
function dupBox(id){const d=exDef(id);if(!d)return'';return `<div class="dupask" role="alert"><b>같은 이름의 종목이 이미 있어요: ${esc(d.name)} (${TYPES[d.type]})</b><p>같은 운동이면 기존 종목을 쓰세요. 지난 기록과 통계가 하나로 이어져요.</p><div class="row"><button class="ghost sm ok" data-dup="use">기존 종목 쓰기</button><button class="ghost sm" data-dup="new">따로 새로 만들기</button></div></div>`}
function hasDone(en){if(!en)return false;if(en.sets)return en.sets.some(s=>s.done);return !!en.done||en.rounds>0}
function exDone(ex,en){if(en.sets)return en.sets.length>0&&en.sets.every(s=>s.done);return !!en.done}
function fcfg(ex,v){return v==='B'?{n:ex.bN||4,reps:ex.bR||4}:{n:ex.aN||5,reps:ex.aR||5}}
/* 횟수를 비워 두고 ✓하면 넣을 값(회색 안내 숫자와 같음): 지난번과 같은 무게면 지난번 그 세트 횟수,
   무게를 바꿨거나 지난 기록이 없으면 목표 하한. 입력 없이 ✓만 눌러도 '지난번만큼 했다'로 남아 증량 제안이 잘못 나오지 않음 */
function defReps(it,i){const ex=it.ex,en=it.en;if(ex.type==='flow')return String(fcfg(ex,en.variant).reps);
 const last=W&&lastEntry(ex.id,W),ls=last&&last.t===ex.type&&last.en.sets?last.en.sets.filter(x=>x.done):[],p=ls[i]||ls[ls.length-1],cur=en.sets&&en.sets[i];
 if(p&&num(p.r)>0&&(ex.type!=='weight'||(cur&&num(p.w)===num(cur.w))))return String(num(p.r));return String(ex.lo||ex.hi||'')}
function phOf(it,i,k){return k==='w'?'0':k==='s'?String(it.ex.target):defReps(it,i)}
function nSets(ex,en){if(ex.type==='flow')return fcfg(ex,en&&en.variant).n;return ex.sides?(ex.n||3)*2:(ex.n||3)}
/* 세트 수를 줄일 때는 끝에서부터 안 한 세트만 지움 (완료한 세트는 그대로) */
function trimSets(sets,n){for(let j=sets.length-1;j>=0&&sets.length>n;j--)if(!sets[j].done)sets.splice(j,1)}
function fixFlow(ex,e){if(!e||ex.type!=='flow')return e;if(!FLOW[e.variant])e.variant='A';const c=fcfg(ex,e.variant);
 if(!e.sets){const was=!!e.done;e.sets=Array.from({length:c.n},()=>({r:was?String(c.reps):'',done:was}));delete e.done}
 while(e.sets.length<c.n)e.sets.push({r:'',done:false});
 trimSets(e.sets,c.n);return e}
function resizeEntry(it){const ex=it.ex,en=it.en;if(ex.type==='flow')return fixFlow(ex,en);if(!en.sets)return en;const n=nSets(ex,en);
 while(en.sets.length<n)en.sets.push(ex.type==='hold'?{s:'',done:false}:{w:ex.type==='weight'&&en.sets[0]?en.sets[0].w:'',r:'',done:false});
 trimSets(en.sets,n);return en}

/* 직접 고친 백업이 화면을 깨거나 HTML로 끼어들지 않게: 숫자 칸은 숫자로, id·색은 정해진 모양만 받음 */
const IDRE=/^[\w:.-]+$/,KEYRE=/^[\w-]+$/,NUMK=['n','lo','hi','inc','rest','target','rounds','reps','min','aN','aR','bN','bR'];
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
function cleanEx(e){if(!isObj(e)||!TYPES[e.type]||!IDRE.test(String(e.id||'')))return false;e.id=String(e.id);e.name=String(e.name||e.id);
 for(const k of NUMK)if(e[k]!=null)e[k]=num(e[k]);if(e.note!=null)e.note=String(e.note);return true}
function cleanSettings(){const st=isObj(db.settings)?db.settings:{};db.settings=st;
 if(st.plates!=null){const p=Array.isArray(st.plates)?st.plates.map(Number).filter(x=>x>0):[];if(p.length)st.plates=p;else delete st.plates}
 if(st.bar!=null&&!(+st.bar>=0))delete st.bar;for(const k of ['rest','holdMax','clip'])if(st[k]!=null&&!isObj(st[k]))delete st[k];
 if(st.rest)for(const k in st.rest)st.rest[k]=num(st.rest[k]);
 if(db.challenge!=null&&!(isObj(db.challenge)&&/^\d{4}-\d\d-\d\d$/.test(db.challenge.start||'')))delete db.challenge;
 if(db.dayMap!=null&&!isObj(db.dayMap))delete db.dayMap;if(db.prSeen!=null&&!isObj(db.prSeen))delete db.prSeen;if(db.lastBackup!=null&&!(+db.lastBackup>0))delete db.lastBackup;
 if(db.rest!=null&&!(isObj(db.rest)&&+db.rest.end>0&&typeof db.rest.w==='string'))delete db.rest;else if(db.rest){db.rest.start=num(db.rest.start);db.rest.mini=!!db.rest.mini}
 const tm=db.timer;if(tm!=null){if(isObj(tm)&&+tm.t0>0&&typeof tm.w==='string'&&['hold','emom','clock'].includes(tm.mode)){for(const k of ['t0','i','target','rounds','reps','dur'])if(tm[k]!=null)tm[k]=num(tm[k]);tm.title=String(tm.title||'');tm.max=!!tm.max}else delete db.timer}}
/* 이전 형식(날짜별 세션) → 운동 단위로 옮기기 */
function migrate(){
 db.workouts=isObj(db.workouts)?db.workouts:{};db.custom=Array.isArray(db.custom)?db.custom.filter(cleanEx):[];cleanSettings();
 if(db.routines&&!isObj(db.routines))delete db.routines;
 if(db.routines){delete db.routines.X;for(const k in db.routines){const r=db.routines[k];if(!isObj(r)||!KEYRE.test(k)){delete db.routines[k];continue}
  r.ex=Array.isArray(r.ex)?r.ex.filter(cleanEx):[];r.name=String(r.name||'루틴');r.sub=String(r.sub||'');if(!COLORS.includes(r.color))r.color=({S:'red',P:'blue',C:'green'}[k])||'yellow';
  for(const ex of r.ex)if(ex.type==='flow'&&ex.aN==null){Object.assign(ex,{aN:5,aR:5,bN:4,bR:4});if(!ex.rest)ex.rest=60;delete ex.min}}}
 if(db.dayMap)for(const d in db.dayMap)if(db.dayMap[d]!=='X'&&!RT()[db.dayMap[d]])db.dayMap[d]='X';
 if(db.sessions){for(const date of Object.keys(db.sessions).sort()){const s=db.sessions[date],ents=s.entries||{},m=s.memo||{};
   const ids=Object.keys(ents).filter(id=>hasDone(ents[id]));
   if(!ids.length&&!(m.text||(m.pain||[]).length||m.sleep||m.fatigue))continue;
   const r=RT()[s.routine],order=r?r.ex.map(e=>e.id):[];ids.sort((a,b)=>((order.indexOf(a)+1)||99)-((order.indexOf(b)+1)||99));
   const ts=[];const items=ids.map(id=>{const en=ents[id],ss=en.sets||[];
    /* 지금은 없는 종목이면 남은 기록 모양으로 기록 방식을 짐작 (무게가 있으면 무게×횟수 등) */
    const guess=ss.some(s=>s.w)?{type:'weight',inc:2.5}:ss.some(s=>s.s)?{type:'hold',target:30}:en.sets?{type:'reps'}:en.rounds?{type:'emom',rounds:en.rounds,reps:10}:{type:'cardio',min:10};
    const ex=clone(findDef(id)||Object.assign({id,name:id,n:ss.length||3,lo:10,hi:10},guess));fixFlow(ex,en);
    if(en.t)ts.push(en.t);(en.sets||[]).forEach(x=>{if(x.t)ts.push(x.t)});return{u:uid(),ex,en}});
   const st=ts.length?Math.min(...ts):null,wid='w'+date.replace(/-/g,'');
   db.workouts[wid]={id:wid,date,created:st||pdate(date).getTime()+12*36e5,start:st,end:ts.length>1?Math.max(...ts):null,routine:r?s.routine:null,
    name:fmtDate(date,0).replace(/ \(.\)$/,'')+(st?' '+period(new Date(st).getHours()):'')+' 운동',items,memo:m,status:'done'}}
  delete db.sessions}
 if(db.routines&&!Object.keys(db.routines).length)delete db.routines;
 /* 손상된 기록(직접 고친 백업 등)이 있으면 화면이 깨지므로 형식이 안 맞는 운동·종목은 버림 */
 for(const id of Object.keys(db.workouts)){const w=db.workouts[id];
  if(!isObj(w)||!KEYRE.test(id)||!/^\d{4}-\d\d-\d\d$/.test(w.date||'')||!Array.isArray(w.items)){delete db.workouts[id];continue}
  w.id=id;if(!['plan','run','done'].includes(w.status))w.status='done';w.name=String(w.name||autoName(w.date));if(w.routine!=null&&typeof w.routine!=='string')w.routine=null;
  const m=w.memo=isObj(w.memo)?w.memo:{};for(const k of ['sleep','fatigue'])if(m[k]!=null){m[k]=Math.round(num(m[k]));if(!(m[k]>=1&&m[k]<=5))delete m[k]}
  if(m.pain!=null)m.pain=Array.isArray(m.pain)?m.pain.filter(p=>PAINS.includes(p)):[];if(m.text!=null)m.text=String(m.text);
  w.prs=Array.isArray(w.prs)?w.prs.filter(isObj).map(p=>({txt:String(p.txt||''),d:String(p.d||'')})):[];
  w.items=w.items.filter(it=>isObj(it)&&isObj(it.en)&&cleanEx(it.ex));
  for(const it of w.items){if(!KEYRE.test(String(it.u||'')))it.u=uid();const en=it.en;if(en.sets!=null&&!Array.isArray(en.sets))delete en.sets;
   if(en.sets){en.sets=en.sets.filter(isObj);for(const s of en.sets){for(const k of ['w','r','s'])if(s[k]!=null&&s[k]!=='')s[k]=String(num(s[k]));s.done=!!s.done}}
   if(en.rounds!=null)en.rounds=num(en.rounds);if(en.w!=null)en.w=en.w===''?'':String(num(en.w));
   if(en.memo!=null){const v=String(en.memo).trim();if(v)en.memo=v;else delete en.memo}
   if(it.ex.type==='flow')fixFlow(it.ex,en);else if(!en.sets&&['weight','reps','hold'].includes(it.ex.type)){en.sets=[];resizeEntry(it)}}
  if(!(w.cur>=0&&w.cur<w.items.length))w.cur=0}
 if(db.active&&!(db.workouts[db.active]&&db.workouts[db.active].status!=='done'))db.active=null;
 db.v=3}
migrate();save();

/* ---------- 운동(workout) ---------- */
let W=null;
function wsort(w){return w.date+'|'+String(w.start||w.created||0).padStart(15,'0')}
function doneWs(){return Object.values(db.workouts).filter(w=>w.status==='done'&&w.items.some(it=>hasDone(it.en))).sort((a,b)=>wsort(a)<wsort(b)?-1:1)}
function wsOn(date){return Object.values(db.workouts).filter(w=>w.date===date&&(w.status!=='done'||w.items.some(it=>hasDone(it.en))||memoHas(w.memo))).sort((a,b)=>wsort(a)<wsort(b)?-1:1)}
function memoHas(m){return m&&(m.text||(m.pain||[]).length||m.sleep||m.fatigue)}
function wcolor(w){return w.routine&&RT()[w.routine]?rcolor(w.routine):'plate5'}
function lastEntry(id,w){const key=wsort(w);let best=null;
 for(const o of Object.values(db.workouts)){if(o.id===w.id||o.status!=='done')continue;const k=wsort(o);if(k>=key)continue;
  for(const it of o.items)if(it.ex.id===id&&hasDone(it.en)&&(!best||k>best.k))best={k,date:o.date,en:it.en,t:it.ex.type,ex:it.ex}}return best}
function suggestion(ex,last){if(ex.type!=='weight'||!last||last.t!=='weight'||!last.en.sets)return null;const s=last.en.sets.filter(x=>x.done);if(s.length<nSets(ex))return null;if(s.every(x=>+x.r>=ex.hi)){const w=+s[0].w||0;return +(w+ex.inc).toFixed(2)}return null}
/* 애니멀플로우 A/B는 요일과 상관없이 지난번과 번갈아 고름 (처음이면 A) */
function flowDefault(w,last){return(last&&last.en.variant==='A')?'B':'A'}
function initEntry(ex,last,w){
 if(ex.type==='weight'||ex.type==='reps'){const ls=last&&last.en.sets||[];return{sets:Array.from({length:nSets(ex)},(_,i)=>({w:ex.type==='weight'?((ls[i]&&ls[i].w)||(ls[0]&&ls[0].w)||''):'',r:'',done:false}))}}
 if(ex.type==='hold')return{sets:Array.from({length:nSets(ex)},()=>({s:'',done:false}))};
 if(ex.type==='emom')return{rounds:0,done:false,w:(last&&last.t==='emom'&&last.en.w)||''};
 if(ex.type==='flow'){const v=flowDefault(w,last);return{variant:v,sets:Array.from({length:fcfg(ex,v).n},()=>({r:'',done:false}))}}
 return{done:false}}
function autoName(date){const h=date===today()?new Date().getHours():null;const d=pdate(date);return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(h!=null?' '+period(h):'')+' 운동'}
function newWorkout(date,rk){const w={id:'w'+Date.now().toString(36)+uid().slice(0,3),date,created:Date.now(),start:null,end:null,routine:rk||null,name:autoName(date),items:[],memo:{},status:'plan',cur:0};
 db.workouts[w.id]=w;if(rk)loadRoutine(w,rk);if(date===today())db.active=w.id;save();return w}
function addItem(w,def){const ex=clone(def);const it={u:uid(),ex,en:null};it.en=initEntry(ex,lastEntry(ex.id,w),w);w.items.push(it);return it}
function loadRoutine(w,rk){const r=RT()[rk];if(!r)return 0;if(!w.routine)w.routine=rk;const has=new Set(w.items.map(it=>it.ex.id));let n=0;for(const e of r.ex)if(!has.has(e.id)){addItem(w,e);n++}return n}
function item(u){return W&&W.items.find(it=>it.u===u)}
function wStats(w){let sets=0,vol=0,ex=0,full=0;const ts=[];
 for(const it of w.items){const en=it.en,e=it.ex;if(!hasDone(en))continue;ex++;if(exDone(e,en))full++;if(en.t)ts.push(en.t);
  if(en.sets)for(const x of en.sets)if(x.done){sets++;if(x.t)ts.push(x.t);if(e.type==='weight')vol+=num(x.w)*num(x.r)}}
 const st=w.start||(ts.length?Math.min(...ts):null),en=w.end||(w.status!=='done'?Date.now():(ts.length?Math.max(...ts):null));
 /* 지난 날짜를 나중에 입력한 기록은 입력한 시간이 운동 시간으로 잡히지 않게 함 */
 return{sets,vol,ex,full,mins:st&&en&&en>st&&dstr(new Date(st))===w.date?Math.round((en-st)/60000):null}}
function nextIdx(w,from){const n=w.items.length;for(let k=1;k<=n;k++){const j=(from+k)%n;const it=w.items[j];if(!exDone(it.ex,it.en))return j}return null}
function allDone(w){return w.items.length>0&&w.items.every(it=>exDone(it.ex,it.en))}

/* ---------- 새 기록 ---------- */
const e1=s=>num(s.w)*(1+num(s.r)/30);
function bestBefore(id,w){let b=0,mx=0,h=0;const key=wsort(w);for(const o of Object.values(db.workouts)){if(o.id===w.id||o.status!=='done'||wsort(o)>=key)continue;
 for(const it of o.items){if(it.ex.id!==id||!it.en.sets)continue;for(const s of it.en.sets)if(s.done){if(num(s.w)>0){b=Math.max(b,e1(s));mx=Math.max(mx,num(s.w))}h=Math.max(h,num(s.s))}}}return{e:b,w:mx,h}}
function prsFor(w){const out=[];for(const it of w.items){const ex=it.ex,en=it.en;if(!en.sets)continue;const st=en.sets.filter(x=>x.done);if(!st.length)continue;const pb=bestBefore(ex.id,w);
 if(ex.type==='weight'){if(!pb.e)continue;const tw=Math.max(...st.map(x=>num(x.w))),te=Math.max(...st.map(e1));
  if(tw>pb.w)out.push({id:ex.id,txt:`${ex.name} 최고 무게 ${fmtN(tw)}kg`,d:`+${fmtN(tw-pb.w)}kg`});else if(te>pb.e+0.05)out.push({id:ex.id,txt:`${ex.name} 추정 1RM ${fmtN(te.toFixed(1))}kg`,d:`+${fmtN((te-pb.e).toFixed(1))}kg`})}
 else if(ex.type==='hold'){const th=Math.max(...st.map(x=>num(x.s)));if(pb.h&&th>pb.h)out.push({id:ex.id,txt:`${ex.name} ${th}초`,d:`+${th-pb.h}초`})}}
 return out.filter((p,i,a)=>a.findIndex(q=>q.id===p.id)===i)}
const prShown={};
function checkPR(it){if(!W||W.status==='done')return;const p=prsFor(W).find(x=>x.id===it.ex.id);const key=W.id+it.u+(p&&p.txt);if(p&&!prShown[key]){prShown[key]=1;toast('새 기록 · '+p.txt+' ('+p.d+')');beep(1318,0.12,2)}}
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
function missHint(ex,last){if(ex.type!=='weight'||!last||last.t!=='weight'||!last.en.sets)return'';const st=last.en.sets.filter(x=>x.done&&x.r!=='');if(st.some(x=>num(x.r)<ex.lo))return`<p class="lastwarn">지난번 ${ex.lo}회 미만 세트가 있었어요. 같은 무게로 목표 횟수를 먼저 채우세요.</p>`;return''}

/* ---------- 원판 ---------- */
function plateSplit(w){const bw=barW();w=num(w);if(!w)return null;if(w<bw)return{err:'빈 봉('+fmtN(bw)+'kg)보다 가벼워요'};
 /* 0.25kg 단위로 목표에 가장 가깝게(모자람 최소), 같으면 원판 수가 적게. 앞에서부터 큰 원판을 채우면 2kg·1kg이 섞일 때 틀림 */
 const U=4,T=Math.round((w-bw)/2*U),ps=platesAvail().map(p=>Math.round(p*U)).filter(p=>p>0),best=[[]];
 for(let s=1;s<=T;s++){best[s]=null;for(const p of ps)if(p<=s&&best[s-p]&&(!best[s]||best[s-p].length+1<best[s].length))best[s]=best[s-p].concat(p)}
 let s=T;while(s>0&&!best[s])s--;const out=best[s].map(p=>p/U).sort((a,b)=>b-a),rem=+((w-bw)/2-s/U).toFixed(2);return{out,rem:rem>0.001?rem:0}}
function platesHTML(w,label){const r=plateSplit(w);if(!r)return'';if(r.err)return`<div class="plates">${esc(r.err)}</div>`;
 return `<div class="plates" aria-label="한쪽 원판">${label?'<span>'+label+'</span>':''}${r.out.length?r.out.map(p=>`<span class="pl${p<5?' sm':''}" data-p="${p}">${fmtN(p)}</span>`).join(''):'<span>빈 봉</span>'}${r.rem?`<span>· ${fmtN(r.rem)}kg 모자람</span>`:''}</div>`}

/* ---------- 화면 전환 ---------- */
let V='home';

function backupDue(){const ws=doneWs();if(!ws.length)return null;const ref=db.lastBackup?new Date(db.lastBackup):pdate(ws[0].date);const days=Math.floor((new Date()-ref)/864e5);
 if(days<14)return null;return db.lastBackup?'마지막 백업 '+days+'일 전이에요.':'아직 백업한 적이 없어요.'}

 if(recent){const p=recent.prs[0];h+=`<div class="prcard"><span class="ic" aria-hidden="true">▲</span><div><small>새 기록 · ${ago(recent.date)}</small><b>${esc(p.txt)} <em>${esc(p.d||'')}</em></b>${recent.prs.length>1?`<small>외 ${recent.prs.length-1}개</small>`:''}</div><button class="x" data-prx="${recent.id}" aria-label="닫기">✕</button></div>`}

 if(r){const l=lastOfRoutine(rk);h+=`<div class="reco" style="--c:var(--${rcolor(rk)})"><small>오늘의 추천 · ${DAYS[dow(t)]}요일</small><h2>${esc(r.name)}</h2><p>${r.ex.map(e=>esc(e.name)).join(' · ')}</p><p>${r.ex.length}종목${l?' · 마지막 '+ago(l.date):''}</p><button class="big" data-start="${rk}">이 루틴으로 시작</button></div>`}
 else h+=`<div class="reco" style="--c:var(--yellow)"><small>오늘의 추천 · ${DAYS[dow(t)]}요일</small><h2>쉬는 날</h2><p>가벼운 걷기 정도면 충분해요. 운동하고 싶으면 아래 루틴이나 자유운동으로 시작하세요.</p></div>`;
 h+=`<div class="sech"><h3>내 루틴</h3><span class="note">${rkeys().length}개</span></div><div class="rlist">`+rkeys().map(k=>{const R=RT()[k],l=lastOfRoutine(k);
  return `<div class="rrow" style="--c:var(--${rcolor(k)})"><span class="dot"></span><div><b>${esc(R.name)}</b><small>${R.ex.length}종목 · ${l?'마지막 '+ago(l.date):'아직 기록 없음'}</small></div><button data-start="${k}">시작</button></div>`}).join('')+'</div>';

  if(a.status==='plan'&&!a.items.some(it=>hasDone(it.en))){delete db.workouts[a.id];db.active=null}else{toast('진행 중인 운동이 있어요. 끝내고 새로 시작하세요');W=a;go(a.status==='run'?'run':'plan');return}}

let pEdit=null,pDel=null,pickOpen=false,pickQ='',newEx=null,dupNx=null;
function exSummary(ex){const r=ex.rest?' · 휴식 '+mmss(restOf(ex)):'';
 if(ex.type==='weight'||ex.type==='reps')return ex.n+'×'+(ex.lo===ex.hi?ex.lo:ex.lo+'–'+ex.hi)+'회'+r;
 if(ex.type==='hold')return ex.n+'×'+ex.target+'초'+(ex.sides?' 좌우':'')+r;
 if(ex.type==='emom')return ex.rounds+'분 · 매분 '+ex.reps+'개';
 if(ex.type==='flow')return `A ${fcfg(ex,'A').n}×${fcfg(ex,'A').reps} · B ${fcfg(ex,'B').n}×${fcfg(ex,'B').reps}`+r;
 return ex.min+'분'}
function itemProg(it){const en=it.en;if(en.sets){const d=en.sets.filter(s=>s.done).length;return d?d+'/'+en.sets.length+'세트':''}return en.done?'완료':''}
function exForm(ex,pre,opts){opts=opts||{};const t=ex.type;
 const f=(id,lab,val,type='number',cls)=>`<label class="${cls||''}">${lab}<input id="${pre}-${id}" type="${type}" ${type==='number'?'inputmode="decimal" step="any"':''} value="${esc(val??'')}"></label>`;
 let h=`<div class="form">${f('name','종목 이름',ex.name,'text','w2')}`;
 if(opts.type)h+=`<label class="w2">기록 방식<select id="${pre}-type">${Object.entries(TYPES).filter(([k])=>k!=='flow').map(([k,v])=>`<option value="${k}"${k===t?' selected':''}>${v}</option>`).join('')}</select></label>`;
 if(t==='weight'||t==='reps')h+=f('n','세트 수',ex.n??3)+f('rest','휴식(초)',ex.rest!=null?restOf(ex):90)+f('lo','목표 횟수 최소',ex.lo??8)+f('hi','목표 횟수 최대',ex.hi??10)+(t==='weight'?f('inc','증량 단위(kg)',ex.inc??2.5)+`<label class="cb"><input type="checkbox" id="${pre}-bar"${ex.bar?' checked':''}>바벨 (원판 표시)</label>`:'')+`<label class="cb"><input type="checkbox" id="${pre}-sides"${ex.sides?' checked':''}>좌우 따로 기록</label>`;
 if(t==='hold')h+=f('n','세트 수',ex.n??3)+f('target','목표(초)',ex.target??30)+f('rest','휴식(초)',ex.rest!=null?restOf(ex):30)+`<label class="cb"><input type="checkbox" id="${pre}-sides"${ex.sides?' checked':''}>좌우 따로 기록</label>`;
 if(t==='emom')h+=f('rounds','라운드(분)',ex.rounds??10)+f('reps','매분 횟수',ex.reps??15)+f('inc','무게 단위(kg)',ex.inc??4);
 if(t==='flow')h+=f('aN','루틴 A 세트',ex.aN??5)+f('aR','루틴 A 횟수',ex.aR??5)+f('bN','루틴 B 세트',ex.bN??4)+f('bR','루틴 B 횟수',ex.bR??4)+f('rest','휴식(초)',ex.rest!=null?restOf(ex):60);
 if(t==='cardio')h+=f('min','시간(분)',ex.min??10);
 h+=f('note','고정 안내 (선택 · 매번 보여요)',ex.note,'text','w2');
 if(opts.sync)h+=`<label class="cb w2"><input type="checkbox" id="${pre}-sync" checked>루틴에도 저장</label>`;
 h+=`<div class="row w2" style="grid-column:span 2"><button class="ghost sm ok" data-fs="${pre}">${opts.saveLbl||'저장'}</button><button class="ghost sm" data-fc="${pre}">취소</button></div></div>`;return h}
function readExForm(pre,base){const g=id=>{const e=$(pre+'-'+id);return e?e.value:undefined},n=id=>{const v=g(id);return v===undefined||v===''?undefined:num(v)},c=id=>{const e=$(pre+'-'+id);return e?e.checked:false};
 const o=Object.assign({},base);o.name=(g('name')||'').trim()||base.name||'새 종목';const ty=g('type');if(ty)o.type=ty;
 for(const k of ['n','rest','lo','hi','inc','target','rounds','reps','min','aN','aR','bN','bR']){const v=n(k);if(v!==undefined)o[k]=v}
 const nt=(g('note')||'').trim();if(nt)o.note=nt;else delete o.note;
 if($(pre+'-bar'))o.bar=c('bar')||undefined;if($(pre+'-sides'))o.sides=c('sides')||undefined;
 /* 0초 목표(바로 자동 완료)·음수 휴식 같은 값이 들어가지 않게 정수로 맞춤 */
 for(const k of ['n','lo','hi','target','rounds','reps','min','aN','aR','bN','bR'])if(o[k]!=null)o[k]=Math.max(1,Math.round(o[k]));
 if(o.rest!=null)o.rest=Math.max(0,Math.round(o.rest));if(o.inc!=null&&!(o.inc>0))o.inc=2.5;
 if(o.lo!=null&&o.hi!=null&&o.lo>o.hi)[o.lo,o.hi]=[o.hi,o.lo];if(o.n!=null)o.n=Math.min(10,o.n);
 for(const k of ['aN','bN'])if(o[k]!=null)o[k]=Math.min(10,o[k]);return o}
/* 폼의 휴식 칸은 운동 화면에서 바꾼 값까지 반영해 보여 줌. 그대로 두면 원래 값을 유지하고, 바꾸면 그 값을 쓰고 운동 화면에서 바꾼 값은 지움 */
function restSave(o,prev){if(!prev||o.rest==null)return o;if(o.rest!==restOf(prev)){if(db.settings&&db.settings.rest)delete db.settings.rest[o.id]}else o.rest=prev.rest;return o}
/* 같은 종목이 여러 루틴에 있으면 지금 운동의 루틴 것을 먼저 고름 */
function routineDefRef(id){if(!db.routines)return null;const pk=W&&W.routine&&db.routines[W.routine];if(pk){const e=pk.ex.find(x=>x.id===id);if(e)return e}for(const k in db.routines){const e=db.routines[k].ex.find(x=>x.id===id);if(e)return e}return null}
function inRoutine(id){return !!(routineDefRef(id)||(!db.routines&&Object.values(DEF_R).some(r=>r.ex.some(e=>e.id===id))))}
function renderPlan(){const w=W,edit=w.status==='done',run=w.status==='run';

  return `<div class="pitem${dn?' done':''}${run&&i===w.cur?' cur':''}"><span class="no">${dn?'✓':i+1}</span><div><b>${esc(it.ex.name)}</b><small>${exSummary(it.ex)}${pg?' · '+pg:''}</small></div><div class="acts"><button data-pa="up" data-u="${it.u}" aria-label="위로"${i===0?' disabled':''}>↑</button><button data-pa="down" data-u="${it.u}" aria-label="아래로"${i===w.items.length-1?' disabled':''}>↓</button><button data-pa="edit" data-u="${it.u}" aria-label="수정">✎</button><button class="del${pDel===it.u?' arm':''}" data-pa="del" data-u="${it.u}" aria-label="삭제">${pDel===it.u?'삭제':'✕'}</button></div>${pEdit===it.u?exForm(it.ex,'ie',{sync:inRoutine(it.ex.id)}):''}</div>`}).join('')+'</div>';
 if(pickOpen)h+=pickerHTML();
 else h+=`<button class="ghost" id="p-add" style="width:100%">+ 운동 추가</button><div class="sech"><h3 style="font-size:15px">루틴 불러오기</h3></div><div class="loadrow">${rkeys().map(k=>`<button data-load="${k}" style="--c:var(--${rcolor(k)})"><i></i>${esc(RT()[k].name)} (${RT()[k].ex.length})</button>`).join('')}</div>`;
 if(!edit&&w.items.length)h+=`<button class="ghost sm danger" id="p-discard" style="align-self:flex-start">${pDel==='__w'?'정말 취소하기':'이 운동 취소하기'}</button>`;

 const go2=$('pb-go');go2.textContent=edit?'수정 끝내기':run?'운동 이어가기':'운동 시작';go2.disabled=!w.items.length;
}

 return `${gs.map(g=>`<div class="libg"><h4 style="--c:var(--${g.c})"><i></i>${esc(g.name)}</h4>${g.items.map(e=>`<button class="libitem" data-addex="${e.id}"><span><b>${esc(e.name)}</b><small>${TYPES[e.type]} · ${exSummary(e)}</small></span><em>${inW.has(e.id)?'추가됨 ✓':'+ 추가'}</em></button>`).join('')}</div>`).join('')||'<p class="note">찾는 종목이 없어요. 아래에서 새로 만드세요.</p>'}

 if(act==='restreset'){if(db.settings&&db.settings.rest)delete db.settings.rest[ex.id];save();refresh(it);return}
 /* 오늘만 세트 수 바꾸기 (루틴은 그대로). 좌우 종목은 한 쌍씩. 완료한 세트는 지우지 않음 */
 if(act==='setn'){const d=+b.dataset.d,n0=ex.n||3,nv=Math.min(10,Math.max(1,n0+d));if(nv===n0)return;
  if(nSets(Object.assign({},ex,{n:nv}))<en.sets.filter(x=>x.done).length){toast('완료한 세트는 지울 수 없어요');return}
  if(d>0&&restW===W.id)cancelAdvance();ex.n=nv;resizeEntry(it);save();refresh(it);return}
 if(act==='ck'){closeKp();const s=en.sets[i];
  if(!s.done){if(ex.type==='hold'&&!s.s)s.s=String(ex.target);if(ex.type!=='hold'&&!s.r)s.r=defReps(it,i);s.done=true;s.t=Date.now();save();refresh(it);checkPR(it);afterDone(it)}
  else{s.done=false;delete s.t;if(restW===W.id)cancelAdvance();save();refresh(it)}}
 else if(act==='sug'){en.sets.forEach(s=>{if(!s.done)s.w=b.dataset.w});save();refresh(it)}
 else if(act==='toggle'){en.done=!en.done;if(en.done)en.t=Date.now();else{delete en.t;if(restW===W.id)cancelAdvance()}if(ex.type==='emom'&&en.done&&!en.rounds)en.rounds=ex.rounds;if(ex.type==='emom'&&!en.done)en.rounds=0;save();refresh(it);if(en.done)afterDone(it)}
 else if(act==='var'){if(b.dataset.v===en.variant)return;if(en.sets.some(s=>s.done)){toast('완료한 세트가 있어서 루틴을 바꿀 수 없어요. 세트 완료를 먼저 풀어 주세요');return}en.variant=b.dataset.v;fixFlow(ex,en);save();refresh(it)}
 else if(act==='hold'){closeKp();stopRest();openTimer({mode:'hold',u:it.u,i,title:ex.name+(ex.sides?(i%2?' · 오른쪽':' · 왼쪽'):' · '+(i+1)+'세트'),target:ex.target,max:holdMax(ex)})}
 else if(act==='emom'){closeKp();stopRest();openTimer({mode:'emom',u:it.u,title:ex.name+(num(en.w)>0?' '+en.w+'kg':''),rounds:ex.rounds,reps:ex.reps})}
 else if(act==='clock'){closeKp();stopRest();openTimer({mode:'clock',u:it.u,title:ex.name,dur:ex.min*60})}});

/* ---------- 운동 끝 ---------- */
function memoCard(w){const m=w.memo||{};
 const sc=(k,v)=>`<div class="scale" role="group">${[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" data-act="memo-${k}" data-v="${n}" aria-pressed="${v===n}">${n}</button>`).join('')}</div>`;
 return `<article class="ex memo" id="card-memo"><header><h3>컨디션</h3><span class="note">운동 후 기록</span></header>
 <div class="q"><span>수면 <small>1 나쁨 · 5 좋음</small></span>${sc('sleep',m.sleep)}</div>
 <div class="q"><span>피로 <small>1 가뿐 · 5 지침</small></span>${sc('fatigue',m.fatigue)}</div>
 <div><div class="note" style="margin-bottom:6px">불편한 곳</div><div class="chips">${PAINS.map(p=>`<button class="${(m.pain||[]).includes(p)?'on':''}" data-act="memo-pain" data-v="${p}" aria-pressed="${(m.pain||[]).includes(p)}">${p}</button>`).join('')}</div></div>
 <textarea id="memo-text" placeholder="예: 데드 마지막 세트 허리 뻐근, 스윙 그립 약함" aria-label="메모">${esc(m.text||'')}</textarea></article>`}
function memoClick(b,w,rer){const m=w.memo=w.memo||{},k=b.dataset.act.slice(5),v=b.dataset.v;
 if(k==='pain'){m.pain=m.pain||[];m.pain=m.pain.includes(v)?m.pain.filter(x=>x!==v):m.pain.concat(v)}else{m[k]=m[k]===+v?undefined:+v}save();rer()}
function summKV(w){const s=wStats(w);return `<div class="kv"><div><small>운동 시간</small><b>${s.mins!=null?s.mins:'–'}</b>${s.mins!=null?'분':''}</div><div><small>완료 종목</small><b>${s.full}</b>/${w.items.length}</div><div><small>완료 세트</small><b>${s.sets}</b></div><div><small>총 볼륨</small><b>${s.vol?Math.round(s.vol).toLocaleString():'–'}</b>${s.vol?'kg':''}</div></div>`}
let finDel=false;
function renderFinish(){const w=W;if(w.status!=='done'&&w.start&&!w.end)w.end=Date.now();/* 메모 쓰는 시간은 운동 시간에서 뺌 */const pr=prsFor(w),left=w.items.filter(it=>!exDone(it.ex,it.en)),any=w.items.some(it=>hasDone(it.en));
 $('v-finish').innerHTML=`<div class="appbar"><button class="back" id="f-back" aria-label="운동으로 돌아가기">‹</button><div class="ttl"><b>운동 끝</b><small>${esc(w.name)}</small></div></div>
 <article class="ex summ">${summKV(w)}${pr.length?'<ul class="prs">'+pr.map(p=>'<li>'+esc(p.txt)+' ('+esc(p.d)+')</li>').join('')+'</ul>':''}
 ${left.length?`<p class="note">완료하지 않은 종목 ${left.length}개: ${left.map(it=>esc(it.ex.name)).join(', ')}. 저장하면 완료한 세트만 기록으로 남아요.</p>`:''}</article>
 ${memoCard(w)}
 ${any?`<button class="big" id="f-save" style="height:52px;border-radius:14px">기록 저장</button>`:`<p class="note">완료한 세트가 없어서 저장할 기록이 없어요.</p>`}
 <div class="row"><button class="ghost" id="f-cont" style="flex:1">계속 운동하기</button><button class="ghost${finDel?' danger':''}" id="f-del" style="flex:1">${finDel?'정말 삭제':'기록 없이 삭제'}</button></div><div style="height:30px"></div>`}
$('v-finish').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const w=W;if(b.id!=='f-del')finDel=false;
 if(b.dataset.act&&b.dataset.act.startsWith('memo-')){memoClick(b,w,()=>{$('v-finish').querySelector('#card-memo').outerHTML=memoCard(w)});return}
 if(b.id==='f-back'||b.id==='f-cont'){w.end=null;save();go('run');return}
 if(b.id==='f-del'){if(!finDel){finDel=true;renderFinish();return}finDel=false;delete db.workouts[w.id];if(db.active===w.id)db.active=null;save();W=null;toast('운동을 삭제했어요');go('home');return}
 if(b.id==='f-save'){w.status='done';w.end=w.start?w.end||Date.now():null;w.prs=prsFor(w).map(p=>({txt:p.txt,d:p.d}));if(db.active===w.id)db.active=null;save();stopRest();toast('기록을 저장했어요');go('detail')}});
$('v-run').addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.exmemo||!W)return;const it=W.items.find(x=>x.u===t.dataset.exmemo);if(!it)return;

$('v-finish').addEventListener('input',e=>{if(e.target.id==='memo-text'){W.memo=W.memo||{};W.memo.text=e.target.value;save()}});
$('v-detail').addEventListener('input',e=>{if(e.target.id==='memo-text'){W.memo=W.memo||{};W.memo.text=e.target.value;save()}
 const u=e.target.dataset&&e.target.dataset.dexmemo,it=u&&W&&W.items.find(x=>x.u===u);if(it){if(e.target.value.trim())it.en.memo=e.target.value;else delete it.en.memo;save()}});

 h+=`</div><div class="legend">${rkeys().map(k=>`<span><i style="background:var(--${rcolor(k)})"></i>${esc(RT()[k].name)}</span>`).join('')}<span><i style="background:var(--plate5)"></i>자유운동</span><span style="margin-left:auto">이번 달 ${cnt}일 운동</span></div>`;
 $('calpanel').innerHTML=h;renderDay()}
function wLines(w){const out=[];for(const it of w.items){const en=it.en,ex=it.ex;if(!hasDone(en))continue;
 if(ex.type==='weight'&&en.sets){const st=en.sets.filter(x=>x.done);const ws=[...new Set(st.map(x=>x.w))];out.push(ex.name+' '+(ws.length===1?(ws[0]?ws[0]+'kg × ':'')+st.map(x=>x.r).join('/'):st.map(x=>x.w+'×'+x.r).join(' · ')))}
 else if((ex.type==='reps'||ex.type==='flow')&&en.sets)out.push(ex.name+(ex.type==='flow'?' 루틴 '+en.variant:'')+' '+en.sets.filter(x=>x.done).map(x=>x.r).join('/')+'회');
 else if(ex.type==='hold'&&en.sets)out.push(ex.name+' '+en.sets.filter(x=>x.done).map(x=>x.s).join('/')+'초');
 else if(ex.type==='emom')out.push(ex.name+' '+(num(en.w)>0?en.w+'kg · ':'')+en.rounds+'라운드');else out.push(ex.name+' 완료')}return out}
function renderDay(){const d=calSel,ws=wsOn(d);
 let h=`<div class="sech"><h3>${fmtDate(d)}</h3><span class="note">${ws.length?ws.length+'개 운동':''}</span></div>`;
 h+=ws.length?ws.map(w=>{const s=wStats(w),ls=wLines(w);return `<button class="wcard" data-w="${w.id}" style="--c:var(--${wcolor(w)})"><span class="d">${esc(w.name)}<span>${w.start?hm(w.start):''}${s.mins?' · '+s.mins+'분':''}</span></span>${w.status!=='done'?'<span class="live">진행 중 · 눌러서 이어하기</span>':''}<ul>${ls.slice(0,4).map(l=>'<li>'+esc(l)+'</li>').join('')}${ls.length>4?`<li>외 ${ls.length-4}개</li>`:''}</ul></button>`}).join(''):'<div class="empty2">이 날은 기록이 없어요.</div>';
 if(d<=today())h+=`<button class="ghost" id="d-add" style="width:100%">+ 이 날 운동 기록하기</button>`;
 $('daypanel').innerHTML=h}
$('v-record').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='c-prev'||b.id==='c-next'){const [y,m]=calM.split('-').map(Number);const d=new Date(y,m-1+(b.id==='c-next'?1:-1),1);calM=dstr(d).slice(0,7);renderRecord();return}
 if(b.dataset.cd){calSel=b.dataset.cd;if(calSel.slice(0,7)!==calM)calM=calSel.slice(0,7);renderRecord();return}
 if(b.dataset.w){W=db.workouts[b.dataset.w];if(W.status==='done')go('detail');else go(W.status==='run'?'run':'plan');return}
 if(b.id==='d-add'){if(calSel===today()){startNew(calSel,null);return}W=newWorkout(calSel,null);go('plan')}});
let detDel=false,detMemo=false,detExMemo=null;
function summText(w){const s=wStats(w),lines=[`${fmtDate(w.date)} ${w.name}${w.start?' ('+hm(w.start)+(w.end?'–'+hm(w.end):'')+')':''}`];
 for(const l of wLines(w))lines.push('- '+l);
 for(const it of w.items)if(it.en.memo)lines.push('- '+it.ex.name+' 메모: '+it.en.memo);

 for(const p of (w.prs||[]))lines.push('새 기록: '+p.txt+' ('+p.d+')');

 if(m.text)lines.push('메모: '+m.text);return lines.join('\n')}
function renderDetail(){const w=W,m=w.memo||{};

  const mem=en.memo||'',mui=detExMemo===it.u?`<div class="exmemo"><small>이 날 ${esc(ex.name)}에만 남는 메모</small><textarea data-dexmemo="${it.u}" rows="2" maxlength="500" placeholder="예: 그립이 미끄러짐, 왼쪽 무릎 시큰" aria-label="${esc(ex.name)} 메모">${esc(mem)}</textarea><button class="okb" data-dxm="${it.u}">확인</button></div>`
   :mem?`<button class="daymemo" data-dxm="${it.u}" aria-label="${esc(ex.name)} 메모 고치기"><small>메모 ✎</small>${esc(mem)}</button>`:`<button class="addmemo" data-dxm="${it.u}">+ 메모</button>`;
  return `<div class="dex"><header><h4>${esc(ex.name)}${ex.type==='flow'?' · 루틴 '+en.variant:''}</h4><span class="tgt">${ex.type==='flow'?fcfg(ex,en.variant).n+'×'+fcfg(ex,en.variant).reps+'회':exSummary(ex).split(' · 휴식')[0]}</span></header><ol>${rows}</ol>${mui}</div>`}).join('');
 /* 컨디션은 상세에서도 고칠 수 있음 ('기록 수정'이나 지난 날짜 입력은 운동 끝 화면을 거치지 않음) */
 if(detMemo)h+=memoCard(w)+`<button class="ghost sm" id="dt-memo-done" style="align-self:flex-start">컨디션 다 고쳤어요</button>`;
 else if(!memoHas(m))h+=`<button class="ghost sm" id="dt-memo" style="align-self:flex-start">+ 컨디션 기록</button>`;

 $('v-detail').innerHTML=h}
$('v-detail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const w=W;if(b.id!=='dt-del')detDel=false;

 if(b.dataset.dxm){const it=w.items.find(x=>x.u===b.dataset.dxm);if(!it)return;const was=detExMemo;detExMemo=null;

/* ---------- 키패드 ---------- */
let kp=null;
const kpEl=$('kp');

function kpItem(){return kp&&item(kp.u)}
function openKp(u,i,k){const it=item(u);if(!it)return;const prev=kp;kp={u,i,k,fresh:true,all:false};
 if(prev&&prev.u!==u){const pi=item(prev.u);if(pi)refresh(pi)}

 const c=$(u+'-'+i+'-'+k);if(c){const r=c.getBoundingClientRect(),limit=innerHeight-kpEl.offsetHeight-12;if(r.bottom>limit||r.top<0)window.scrollBy({top:r.bottom-limit+40})}}

/* i가 -1이면 세트가 아니라 종목 전체 값 (EMOM 무게) */
function kpObj(it,i){return i<0?it.en:it.en.sets[i]}
function kpVal(){const it=kpItem();return String(kpObj(it,kp.i)[kp.k]??'')}
function kpLabel(ex){if(kp.i<0)return'무게';const lab=ex.sides?(kp.i%2?'오른쪽 ':'왼쪽 ')+(Math.floor(kp.i/2)+1):(kp.i+1)+'세트';return lab+' · '+({w:'무게',r:'횟수',s:'시간'}[kp.k])}
function paintKp(){const it=kpItem(),ex=it.ex,v=kpVal(),[sm,bg]=kpStep(ex,kp.k),u={w:'kg',r:'회',s:'초'}[kp.k];
 $('kp-ex').textContent=ex.name;$('kp-lbl').textContent=kpLabel(ex);
 const n=$('kp-num');n.textContent=(v===''?'0':v)+' '+u;n.classList.toggle('fresh',kp.fresh&&v!=='');
 $('kp-sm').textContent='−'+fmtN(sm);$('kp-sp').textContent='+'+fmtN(sm);$('kp-bm').textContent='−'+fmtN(bg);$('kp-bp').textContent='+'+fmtN(bg);
 $('kp-dot').disabled=kp.k!=='w';
 $('kp-one').parentNode.hidden=kp.i<0;$('kp-one').className=kp.all?'':'on';$('kp-all').className=kp.all?'on':'';$('kp-one').setAttribute('aria-pressed',!kp.all);$('kp-all').setAttribute('aria-pressed',kp.all);
 $('kp-plates').innerHTML=(kp.k==='w'&&ex.bar)?platesHTML(v,'한쪽 원판'):'';paintKpRest();
 const c=$(kp.u+'-'+kp.i+'-'+kp.k);if(c){c.classList.add('editing');c.classList.toggle('fresh',kp.fresh)}}
function paintKpRest(){const el=$('kp-rt');if(!el)return;const left=(restEnd-Date.now())/1000;el.textContent=restIv&&!$('rest').hidden?(left>0?'휴식 '+mmss(Math.ceil(left)):'휴식 끝'):''}
function kpSet(v){const it=kpItem(),ex=it.ex,en=it.en;kpObj(it,kp.i)[kp.k]=v;
 if(kp.all&&en.sets)en.sets.forEach((s,j)=>{if(j!==kp.i&&!s.done)s[kp.k]=v});save();
 const ids=kp.all&&en.sets?en.sets.map((_,j)=>j):[kp.i];
 for(const j of ids){const c=$(kp.u+'-'+j+'-'+kp.k);if(c){const val=kpObj(it,j)[kp.k];c.querySelector('.v,.ph').outerHTML=val!==''?'<span class="v">'+esc(val)+'</span>':'<span class="ph">'+phOf(it,j,kp.k)+'</span>'}}
 /* 무게를 바꾸면 '지난번과 같은 무게인지'가 달라지므로 비어 있는 횟수 칸의 안내 숫자도 다시 계산 */
 if(kp.k==='w')for(const j of ids){const c=$(kp.u+'-'+j+'-r'),ph=c&&c.querySelector('.ph');if(ph)ph.textContent=defReps(it,j)}
 if(ex.bar&&kp.k==='w'&&en.sets){const cd=$('card-'+it.u);const old=cd&&cd.querySelector(':scope > .plates');const nx=en.sets.find(s=>!s.done)||en.sets[0];const h=nx&&nx.w?platesHTML(nx.w,'한쪽'):'';if(old)old.outerHTML=h||'<span hidden></span>';else if(h&&cd)cd.insertAdjacentHTML('beforeend',h)}
 paintKp()}
function kpCells(){const it=kpItem(),ex=it.ex;if(!it.en.sets)return[[-1,'w']];const ks=ex.type==='weight'?['w','r']:ex.type==='hold'?['s']:['r'];const out=[];it.en.sets.forEach((_,i)=>ks.forEach(k=>out.push([i,k])));return out}
function kpPress(k){if(!kp)return;const it=kpItem(),ex=it.ex;let v=kpVal();
 if(/^[0-9]$/.test(k)){if(kp.fresh)v='';if(v==='0')v='';if(v.replace('.','').length<5)v+=k;kp.fresh=false;kpSet(v);return}
 if(k==='.'){if(kp.k!=='w')return;if(kp.fresh)v='';if(!v.includes('.'))v=(v||'0')+'.';kp.fresh=false;kpSet(v);return}
 if(k==='bs'){v=kp.fresh?'':v.slice(0,-1);kp.fresh=false;kpSet(v);return}
 if(k==='s-'||k==='s+'||k==='b-'||k==='b+'){const [sm,bg]=kpStep(ex,kp.k);const st=k[0]==='s'?sm:bg;const base=num(v)||num(phOf(it,kp.i,kp.k));let n=Math.max(0,base+(k[1]==='+'?st:-st));kp.fresh=false;kpSet(fmtN(n));return}
 if(k==='prev'||k==='next'){const cells=kpCells();const idx=cells.findIndex(([i,kk])=>i===kp.i&&kk===kp.k);const nx=cells[idx+(k==='next'?1:-1)];if(!nx)return;
  const old=$(kp.u+'-'+kp.i+'-'+kp.k);if(old)old.classList.remove('editing','fresh');kp.i=nx[0];kp.k=nx[1];kp.fresh=true;kp.all=false;paintKp();return}
 if(k==='ok')closeKp()}

/* ---------- 통계 ---------- */
let statEx=null;
/* 한 운동에 같은 종목이 둘이면(종목 합치기 뒤 등) 세트를 모아 한 점으로 봄 */
function exHistory(id){const out=[];for(const w of doneWs()){const its=w.items.filter(it=>it.ex.id===id&&hasDone(it.en));if(!its.length)continue;
 const ex=its[its.length-1].ex,en=its.length===1?its[0].en:{sets:its.some(it=>it.en.sets)?its.flatMap(it=>it.en.sets||[]):undefined,rounds:Math.max(0,...its.map(it=>it.en.rounds||0)),w:fmtN(Math.max(0,...its.map(it=>num(it.en.w)))),memo:its.map(it=>it.en.memo).filter(Boolean).join(' / ')||undefined};{
 if(ex.type==='weight'&&en.sets){const st=en.sets.filter(x=>x.done&&num(x.w)>0);if(!st.length)continue;const top=Math.max(...st.map(x=>num(x.w)));const ee=Math.max(...st.map(e1));out.push({t:'weight',d:w.date,v1:top,v2:+ee.toFixed(1),reps:st.map(x=>x.r).join('/'),memo:en.memo})}
 else if((ex.type==='reps'||ex.type==='flow')&&en.sets){const st=en.sets.filter(x=>x.done);out.push({t:ex.type,d:w.date,v1:st.reduce((a,x)=>a+num(x.r),0),memo:en.memo})}
 else if(ex.type==='hold'&&en.sets){const st=en.sets.filter(x=>x.done);out.push({t:'hold',d:w.date,v1:Math.max(0,...st.map(x=>num(x.s))),memo:en.memo})}
 else if(ex.type==='emom'){const kg=num(en.w);out.push(kg>0?{t:'emomw',d:w.date,v1:kg,sub:(en.rounds||0)+'라운드',memo:en.memo}:{t:'emom',d:w.date,v1:en.rounds||0,memo:en.memo})}}}
 /* 기록 방식을 바꾼 종목은 kg과 횟수가 한 선에 섞이지 않게 마지막 방식의 기록만 씀 */
 const fam=t=>t==='emomw'?'emom':t,ty=out.length?fam(out[out.length-1].t):null;let r=out.filter(p=>fam(p.t)===ty);
 /* EMOM은 무게를 한 번이라도 적었으면 무게 그래프 (무게를 안 적은 날은 뺌) */
 if(ty==='emom'&&r.some(p=>p.t==='emomw'))r=r.filter(p=>p.t==='emomw');return r}
function statable(){const ids=[];for(const g of library())for(const ex of g.items)if(['weight','reps','hold','emom','flow'].includes(ex.type)&&!ids.includes(ex.id))ids.push(ex.id);
 for(const w of doneWs())for(const it of w.items)if(['weight','reps','hold','emom','flow'].includes(it.ex.type)&&!ids.includes(it.ex.id))ids.push(it.ex.id);
 return ids.filter(id=>exHistory(id).length)}
function exName(id){const d=exDef(id);return d?d.name:id}
function renderStats(){render100();const ids=statable(),pk=$('picker'),box=$('chartbox');
 if(!ids.length){pk.innerHTML='';box.innerHTML='<div class="empty">무게나 횟수를 기록하면 종목별 그래프가 생겨요.</div>';return}
 if(!ids.includes(statEx))statEx=ids[0];pk.innerHTML=ids.map(id=>`<button class="${id===statEx?'on':''}" data-sx="${id}">${esc(exName(id))}</button>`).join('');drawChart()}
$('picker').addEventListener('click',e=>{const b=e.target.closest('[data-sx]');if(!b)return;statEx=b.dataset.sx;renderStats()});
function niceTicks(lo,hi,minSt){if(lo===hi){lo=lo-(minSt?2:1);hi=hi+(minSt?2:1)}const span=hi-lo,raw=span/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));let st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);if(minSt&&st<minSt)st=minSt;if(minSt&&st%1)st=Math.ceil(st);const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const t=[];for(let v=a;v<=b+1e-9;v+=st)t.push(+v.toFixed(2));return t}
function drawChart(){const pts=exHistory(statEx),ty=pts[0].t,box=$('chartbox'),nm=exName(statEx);
 const unit={weight:'kg',reps:'회',hold:'초',emom:'라운드',emomw:'kg',flow:'회'}[ty],two=ty==='weight';
 const name1={weight:'세트 최고 무게',reps:'총 횟수',hold:'최고 버티기',emom:'완료 라운드',emomw:'무게',flow:'총 횟수'}[ty];
 const Wd=Math.max(280,box.clientWidth||320),H=200,pl=40,pr=12,pt=14,pb=26;
 const vals=pts.flatMap(p=>two?[p.v1,p.v2]:[p.v1]);const ticks=niceTicks(Math.min(...vals),Math.max(...vals),two?0:1);const y0=ticks[0],y1=ticks[ticks.length-1];
 const X=i=>pts.length===1?(pl+(Wd-pl-pr)/2):pl+i*(Wd-pl-pr)/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0||1));
 let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(nm)} ${name1} 추이">`;
 for(const t of ticks)s+=`<line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${fmtN(t)}</text>`;
 const xl=pts.length<=3?pts.map((_,i)=>i):[0,Math.floor((pts.length-1)/2),pts.length-1];
 for(const i of xl)s+=`<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="${pts.length>1&&i===0?'start':pts.length>1&&i===pts.length-1?'end':'middle'}">${fmtDate(pts[i].d,true)}</text>`;
 if(two&&pts.length>1)s+=`<polyline class="s2" points="${pts.map((p,i)=>X(i)+','+Y(p.v2)).join(' ')}"/>`;
 if(pts.length>1)s+=`<polyline class="s1" points="${pts.map((p,i)=>X(i)+','+Y(p.v1)).join(' ')}"/>`;
 if(two)pts.forEach((p,i)=>{if(pts.length<=12||i===pts.length-1)s+=`<circle class="p2" cx="${X(i)}" cy="${Y(p.v2)}" r="4"/>`});
 pts.forEach((p,i)=>{if(pts.length<=12||i===pts.length-1)s+=`<circle class="p1" cx="${X(i)}" cy="${Y(p.v1)}" r="4.5"/>`});
 s+=`<line class="cross" id="cx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/><rect id="hit" x="${pl}" y="0" width="${Wd-pl-pr}" height="${H}" fill="transparent"/></svg>`;
 const lg=two?`<div class="legend"><span><i style="background:var(--ink)"></i>${name1}</span><span><i style="background:var(--red)"></i>추정 1RM (점선)</span></div>`:'';
 const rows=pts.slice(-6).reverse().map(p=>`<tr${p.memo?' class="hasm"':''}><td>${fmtDate(p.d,true)}</td><td>${fmtN(p.v1)}${unit}${p.reps?' × '+p.reps:''}${p.sub?' · '+p.sub:''}</td>${two?'<td>'+fmtN(p.v2)+'kg</td>':''}</tr>${p.memo?`<tr class="mrow"><td colspan="${two?3:2}">“${esc(p.memo)}”</td></tr>`:''}`).join('');
 const first=pts[0],lastp=pts[pts.length-1],dlt=lastp.v1-first.v1;
 const summ=pts.length>1?`<p>${fmtDate(first.d,true)} ${fmtN(first.v1)}${unit} → ${fmtDate(lastp.d,true)} ${fmtN(lastp.v1)}${unit} (${dlt>=0?'+':''}${fmtN(dlt)}${unit}, ${pts.length}회 기록)</p>`:'<p>기록이 2번 이상 쌓이면 선으로 이어져요.</p>';
 box.innerHTML=`${lg}${summ}<div class="chart" id="chart">${s}<div class="tip" id="tip" hidden></div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>날짜</th><th>${name1}</th>${two?'<th>추정 1RM</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`;
 const svg=box.querySelector('svg'),tip=$('tip'),cx=$('cx');
 const show=ev=>{const r=svg.getBoundingClientRect(),sx=(ev.clientX-r.left)*Wd/r.width;let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(X(i)-sx);if(dd<bd){bd=dd;bi=i}});const p=pts[bi];
  cx.setAttribute('x1',X(bi));cx.setAttribute('x2',X(bi));cx.setAttribute('visibility','visible');
  tip.hidden=false;tip.innerHTML=`${fmtDate(p.d)}<br>${name1} ${fmtN(p.v1)}${unit}${p.reps?' × '+p.reps:''}${p.sub?' · '+p.sub:''}${two?'<br>추정 1RM '+fmtN(p.v2)+'kg':''}${p.memo?'<br>“'+esc(p.memo.length>40?p.memo.slice(0,40)+'…':p.memo)+'”':''}`;
  const px=X(bi)*r.width/Wd,py=Y(two?Math.max(p.v1,p.v2):p.v1)*r.height/H-10,hw=Math.min(tip.offsetWidth/2,r.width/2);tip.style.left=Math.min(Math.max(px,hw),r.width-hw)+'px';tip.style.top=Math.max(py,40)+'px'};
 /* 터치는 손을 떼도 말풍선을 남기고, 그래프 밖을 누르면 닫음 */
 svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')hideTip()})}
function hideTip(){const t=$('tip'),c=$('cx');if(t)t.hidden=true;if(c)c.setAttribute('visibility','hidden')}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#chart'))hideTip()});
function render100(){const el=$('p100'),ch=db.challenge;
 if(!ch||!ch.start){el.innerHTML=`<h3>내 몸 100일</h3><p>시작일을 정하면 며칠째인지, 시작 때보다 무엇이 달라졌는지 정리해 줘요.</p><div class="row"><button class="ghost sm ok" id="c-today">오늘부터 시작</button><input type="date" id="c-date" aria-label="100일 시작일" style="font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px"><button class="ghost sm" id="c-set">이 날짜로 시작</button></div>`;return}
 const t=today(),n=daysBetween(ch.start,t)+1,end=addDays(ch.start,99),to=t<end?t:end;
 const ws=doneWs().filter(w=>w.date>=ch.start&&w.date<=to),days=new Set(ws.map(w=>w.date));
 let sets=0;const sl=[],fa=[];for(const w of ws){sets+=wStats(w).sets;const m=w.memo||{};if(m.sleep)sl.push(m.sleep);if(m.fatigue)fa.push(m.fatigue)}
 const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
 const chg=[];for(const id of statable()){const h=exHistory(id).filter(p=>p.t==='weight'&&p.d>=ch.start&&p.d<=to);if(!h.length)continue;chg.push({id,name:exName(id),a:h[0].v1,b:h[h.length-1].v1})}
 const label=n<1?'D−'+(1-n):n>100?'완주':'D+'+n,pct=Math.max(0,Math.min(100,n));
 el.innerHTML=`<div class="row" style="justify-content:space-between"><h3>내 몸 100일</h3><button class="ghost sm" id="c-edit">시작일 변경</button></div>

 ${chg.length?'<ul class="chg">'+chg.map(c=>{const d=c.b-c.a;return `<li><span>${esc(c.name)}</span><span>${fmtN(c.a)} → ${fmtN(c.b)}kg <em class="${d<0?'dn':''}">${d>=0?'+':''}${fmtN(d)}</em></span></li>`}).join('')+'</ul>':'<p>기간 안에 무게 기록이 쌓이면 시작 대비 변화가 여기에 보여요.</p>'}
 <div class="row"><button class="ghost sm" id="c-copy">요약 복사</button><span class="msg" id="c-msg"></span></div>

$('p100').addEventListener('click',e=>{const id=e.target.id,el=$('p100');
